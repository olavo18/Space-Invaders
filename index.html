<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Olavo Marchiori</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff0055;
            --space-dark: #050510;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--space-dark);
            background-image: radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 20px);
            background-size: 50px 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #menu-principal {
            text-align: center;
            background: rgba(10, 10, 30, 0.95);
            padding: 50px;
            border-radius: 40px;
            border: 2px solid var(--neon-blue);
            backdrop-filter: blur(15px);
            z-index: 100;
            max-width: 450px;
            width: 90%;
        }

        .btn-menu {
            padding: 16px 25px; font-size: 16px; font-weight: 800; background: transparent;
            color: white; border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 15px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; margin-bottom: 15px; text-transform: uppercase;
        }
        .btn-play { background: var(--neon-pink); border-color: var(--neon-pink); }

        #game-container { 
            display: none; 
            position: relative; 
            width: 800px; 
            height: 600px; 
            background: #000; 
            border: 2px solid var(--neon-blue); 
            overflow: hidden; 
        }

        #dialogo-box {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); color: black; padding: 15px 25px; border-radius: 15px;
            font-weight: 800; display: none; z-index: 200; width: 400px; text-align: center;
            border: 3px solid var(--neon-blue); font-size: 16px;
        }

        #alerta-invasao {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--neon-pink); font-family: 'Orbitron', sans-serif; font-size: 45px;
            text-shadow: 0 0 25px var(--neon-pink); display: none; text-align: center; z-index: 300;
        }
    </style>
</head>
<body>

    <div id="menu-principal">
        <h1 style="font-family: 'Orbitron'; color: var(--neon-blue);">SPACE INVADERS</h1>
        <p style="margin-bottom: 30px;">Olavo Marchiori</p>
        <button class="btn-menu btn-play" onclick="iniciarHistoria()">JOGAR</button>
        <button class="btn-menu" onclick="location.reload()">REINICIAR</button>
    </div>

    <div id="game-container">
        <div id="dialogo-box"></div>
        <div id="alerta-invasao">A INVASÃO COMEÇOU!</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dialBox = document.getElementById('dialogo-box');
        const alerta = document.getElementById('alerta-invasao');

        canvas.width = 800; canvas.height = 600;

        // --- SKINS ---
        const skinPlayer = new Image(); skinPlayer.src = 'jogadorprincipal.png';
        const skinAmigo = new Image(); skinAmigo.src = 'amigo.png';

        let modo = 'menu'; 
        let camera = { x: 0, y: 0, zoom: 1 };
        
        let player = { x: 450, y: 450, w: 60, h: 60, targetX: 450, targetY: 450 };
        let amigo = { x: 250, y: 450, w: 60, h: 60, targetX: 250, targetY: 450 };
        
        let tiros = [];
        let invasores = [];
        const keys = {};

        function iniciarHistoria() {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            modo = 'historia';
            
            // Sequência da Cutscene mais lenta e fluida
            setTimeout(() => {
                camera.zoom = 1.5; // Aproxima a câmera
                falar("Olavo: Eu consigo derrotar esses alienígenas sozinho!", 4000, () => {
                    amigo.targetX = 300; // Amigo se aproxima para falar
                    falar("Amigo: Você enlouqueceu? São muitos, você não vai conseguir!", 4000, () => {
                        falar("Olavo: Eu posso sim! Olha o que eu sei fazer!", 3000, () => {
                            demonstrarHabilidades();
                        });
                    });
                });
            }, 1000);
        }

        function falar(texto, tempo, callback) {
            dialBox.innerText = texto;
            dialBox.style.display = 'block';
            setTimeout(() => {
                dialBox.style.display = 'none';
                if(callback) callback();
            }, tempo);
        }

        function demonstrarHabilidades() {
            player.targetX = 600;
            let disparos = setInterval(() => {
                tiros.push({x: player.x + 28, y: player.y, s: 15});
            }, 200);

            setTimeout(() => {
                clearInterval(disparos);
                player.targetX = 400;
                falar("Olavo: Viu só? Eu dou conta!", 3000, () => {
                    camera.zoom = 1; // Volta a câmera ao normal
                    alerta.style.display = 'block';
                    setTimeout(() => {
                        alerta.style.display = 'none';
                        amigo.targetY = 800; // Amigo sai de cena
                        iniciarJogoReal();
                    }, 2500);
                });
            }, 2000);
        }

        function iniciarJogoReal() {
            modo = 'jogando';
            player.x = 370; player.targetX = 370;
            player.y = 520; player.targetY = 520;
            createAliens();
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
        }

        function createAliens() {
            for(let i=0; i<30; i++) {
                invasores.push({x: (i%10)*65 + 80, y: Math.floor(i/10)*50 + 50, w: 40, h: 30, vivo: true});
            }
        }

        // Função de Suavização (Lerp)
        function lerp(start, end, amt) { return (1 - amt) * start + amt * end; }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            // Lógica de Câmera (Zoom e Foco)
            let targetCamX = -(player.x * camera.zoom - canvas.width/2);
            let targetCamY = -(player.y * camera.zoom - canvas.height/2);
            
            if(modo === 'historia') {
                camera.x = lerp(camera.x, targetCamX, 0.05);
                camera.y = lerp(camera.y, targetCamY, 0.05);
                ctx.translate(camera.x, camera.y);
                ctx.scale(camera.zoom, camera.zoom);
            }

            // Movimentação Suave das Naves
            player.x = lerp(player.x, player.targetX, 0.1);
            player.y = lerp(player.y, player.targetY, 0.1);
            amigo.x = lerp(amigo.x, amigo.targetX, 0.1);
            amigo.y = lerp(amigo.y, amigo.targetY, 0.1);

            // Flutuação constante (para não ficarem parados)
            let flutuar = Math.sin(Date.now() / 200) * 2;

            // Desenhar Jogador
            if(skinPlayer.complete) ctx.drawImage(skinPlayer, player.x, player.y + flutuar, player.w, player.h);
            
            // Desenhar Amigo
            if(modo === 'historia' || amigo.y < 600) {
                if(skinAmigo.complete) ctx.drawImage(skinAmigo, amigo.x, amigo.y + flutuar, amigo.w, amigo.h);
            }

            // Tiros
            ctx.fillStyle = '#fff';
            tiros.forEach((t, i) => {
                t.y -= t.s;
                ctx.fillRect(t.x, t.y, 4, 15);
                if(t.y < -100) tiros.splice(i, 1);
            });

            if(modo === 'jogando') {
                if(keys['ArrowLeft'] && player.targetX > 0) player.targetX -= 8;
                if(keys['ArrowRight'] && player.targetX < canvas.width - player.w) player.targetX += 8;
                if(keys['Space'] && tiros.length < 5) {
                    if(tiros.length === 0 || tiros[tiros.length-1].y < player.y - 150)
                        tiros.push({x: player.x + 28, y: player.y, s: 12});
                }

                invasores.forEach(inv => {
                    if(inv.vivo) {
                        ctx.fillStyle = var(--neon-pink);
                        ctx.fillRect(inv.x, inv.y, inv.w, inv.h);
                        tiros.forEach((t, ti) => {
                            if(t.x > inv.x && t.x < inv.x + inv.w && t.y > inv.y && t.y < inv.y + inv.h) {
                                inv.vivo = false;
                                tiros.splice(ti, 1);
                            }
                        });
                    }
                });
            }
            
            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
