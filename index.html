<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Olavo Marchiori</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff0055;
            --space-dark: #050510;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--space-dark);
            background-image: radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 20px);
            background-size: 50px 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* MENU */
        #menu-principal {
            text-align: center;
            background: rgba(10, 10, 30, 0.9);
            padding: 50px;
            border-radius: 40px;
            border: 2px solid var(--neon-blue);
            backdrop-filter: blur(15px);
            z-index: 100;
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); }
        .subtitle { font-size: 14px; margin-bottom: 40px; opacity: 0.8; }

        .btn-menu {
            padding: 16px 25px; font-size: 16px; font-weight: 800; background: transparent;
            color: white; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 15px;
            cursor: pointer; transition: 0.3s; display: block; width: 100%; margin-bottom: 15px;
        }
        .btn-play { background: var(--neon-pink); border-color: var(--neon-pink); }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--neon-pink); }

        /* TELA DE HISTÓRIA E JOGO */
        #game-container { display: none; position: relative; width: 800px; height: 600px; background: #000; border: 2px solid #333; overflow: hidden; }
        canvas { width: 100%; height: 100%; }

        /* BALÕES DE FALA */
        #dialogo-box {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            background: white; color: black; padding: 15px 25px; border-radius: 15px;
            font-weight: 700; display: none; z-index: 200; width: 300px; text-align: center;
        }
        #dialogo-box::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 10px solid white;
        }

        #alerta-invasao {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--neon-pink); font-family: 'Orbitron', sans-serif; font-size: 40px;
            text-shadow: 0 0 20px var(--neon-pink); display: none; text-align: center; z-index: 300;
        }

        /* MODAIS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: #0a0a1a; border: 1px solid var(--neon-blue); padding: 40px; border-radius: 30px; max-width: 500px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 30px; cursor: pointer; color: var(--neon-pink); }
    </style>
</head>
<body>

    <div id="menu-principal">
        <h1>SPACE INVADERS</h1>
        <div class="subtitle">Olavo Marchiori</div>
        <button class="btn-menu btn-play" onclick="iniciarHistoria()">
            <i class="fa-solid fa-rocket"></i> JOGAR
        </button>
        <button class="btn-menu" onclick="openModal('modalComo')">COMO JOGAR</button>
        <button class="btn-menu" onclick="openModal('modalHist')">HISTÓRIA</button>
    </div>

    <div id="game-container">
        <div id="dialogo-box"></div>
        <div id="alerta-invasao">A INVASÃO COMEÇOU!</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="modalComo" class="modal"><div class="modal-content"><span class="close-btn" onclick="closeModal('modalComo')">&times;</span><h3>COMO JOGAR</h3><p>Setas para mover, Espaço para atirar.</p></div></div>
    <div id="modalHist" class="modal"><div class="modal-content"><span class="close-btn" onclick="closeModal('modalHist')">&times;</span><h3>SOBRE</h3><p>Inspirado no real, modificado por Olavo.</p></div></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dialBox = document.getElementById('dialogo-box');
        const alerta = document.getElementById('alerta-invasao');

        canvas.width = 800; canvas.height = 600;

        let modo = 'menu'; // menu, historia, jogando
        let player = { x: 400, y: 550, w: 40, h: 25, color: '#00ff00' };
        let amigo = { x: 200, y: 550, w: 40, h: 25, color: '#00d2ff' };
        let tiros = [];
        let invasores = [];

        function iniciarHistoria() {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            modo = 'historia';
            rodarCena();
        }

        function falar(texto, tempo, callback) {
            dialBox.innerText = texto;
            dialBox.style.display = 'block';
            setTimeout(() => {
                dialBox.style.display = 'none';
                if(callback) callback();
            }, tempo);
        }

        function rodarCena() {
            // Sequência da conversa
            setTimeout(() => {
                falar("Olavo: Eu consigo derrotar esses alienígenas sozinho!", 3000, () => {
                    falar("Amigo: Você enlouqueceu? São muitos, você não vai conseguir!", 3000, () => {
                        falar("Olavo: Eu posso sim! Olha o que eu sei fazer!", 2000, () => {
                            demonstrarHabilidades();
                        });
                    });
                });
            }, 1000);
        }

        function demonstrarHabilidades() {
            // Animação da nave se movendo e atirando sozinha
            let moveCount = 0;
            let intervalo = setInterval(() => {
                player.x += 10;
                if(moveCount % 5 === 0) tiros.push({x: player.x + 18, y: player.y, s: 10});
                moveCount++;
                if(moveCount > 20) {
                    clearInterval(intervalo);
                    falar("Olavo: Viu só? Eu dou conta!", 2500, () => {
                        alerta.style.display = 'block';
                        setTimeout(() => {
                            alerta.style.display = 'none';
                            amigo.y = 800; // Amigo sai de cena
                            iniciarJogoReal();
                        }, 2000);
                    });
                }
            }, 50);
        }

        function iniciarJogoReal() {
            modo = 'jogando';
            createAliens();
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
        }

        // Lógica de Jogo Simples
        const keys = {};
        function createAliens() {
            for(let i=0; i<30; i++) invasores.push({x: (i%10)*60 + 100, y: Math.floor(i/10)*50 + 50, w: 30, h: 20, vivo: true});
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Player (Olavo)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Desenhar Amigo (só na história)
            if(modo === 'historia') {
                ctx.fillStyle = amigo.color;
                ctx.fillRect(amigo.x, amigo.y, amigo.w, amigo.h);
            }

            // Tiros
            ctx.fillStyle = 'yellow';
            tiros.forEach((t, i) => {
                t.y -= t.s;
                ctx.fillRect(t.x, t.y, 4, 10);
                if(t.y < 0) tiros.splice(i, 1);
            });

            if(modo === 'jogando') {
                if(keys['ArrowLeft'] && player.x > 0) player.x -= 7;
                if(keys['ArrowRight'] && player.x < 760) player.x += 7;
                if(keys['Space'] && tiros.length < 5) tiros.push({x: player.x + 18, y: player.y, s: 7});

                ctx.fillStyle = '#ff0055';
                invasores.forEach(inv => {
                    if(inv.vivo) {
                        ctx.fillRect(inv.x, inv.y, inv.w, inv.h);
                        tiros.forEach((t, ti) => {
                            if(t.x > inv.x && t.x < inv.x + inv.w && t.y > inv.y && t.y < inv.y + inv.h) {
                                inv.vivo = false;
                                tiros.splice(ti, 1);
                            }
                        });
                    }
                });
            }

            requestAnimationFrame(gameLoop);
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        gameLoop();
    </script>
</body>
</html>
