<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Hunter Mission</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff0055;
            --space-dark: #050510;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--space-dark);
            background-image: radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 20px);
            background-size: 50px 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #menu-principal {
            text-align: center;
            background: rgba(10, 10, 30, 0.95);
            padding: 50px;
            border-radius: 40px;
            border: 2px solid var(--neon-blue);
            backdrop-filter: blur(15px);
            z-index: 100;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
            animation: floating 4s infinite ease-in-out;
        }

        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 32px; color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); margin-bottom: 5px; }
        .subtitle { font-size: 14px; margin-bottom: 40px; opacity: 0.9; letter-spacing: 2px; }

        .btn-play {
            padding: 16px 25px; font-size: 16px; font-weight: 800; background: var(--neon-pink);
            color: white; border: none; border-radius: 15px;
            cursor: pointer; transition: 0.3s; width: 100%; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }
        .btn-play:hover { transform: scale(1.05); background: #ff1a6b; }

        #game-container { 
            display: none; position: relative; width: 800px; height: 600px; 
            background: #000; border: 2px solid var(--neon-blue); overflow: hidden; 
        }

        #ui-camada {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; font-family: 'Orbitron';
            font-size: 16px; color: var(--neon-blue); pointer-events: none; z-index: 10;
        }

        #habilidade-ui { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }

        #dialogo-box {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: white; color: black; padding: 20px 30px; border-radius: 20px;
            font-weight: 800; display: none; z-index: 200; width: 450px; text-align: center;
            border: 4px solid var(--neon-blue); font-size: 16px; transition: 0.4s; opacity: 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        #alerta-invasao {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--neon-pink); font-family: 'Orbitron', sans-serif; font-size: 40px;
            text-shadow: 0 0 30px var(--neon-pink); display: none; text-align: center; z-index: 300;
        }

        canvas { background: transparent; }
    </style>
</head>
<body>

    <div id="menu-principal">
        <h1>SPACE INVADERS</h1>
        <div class="subtitle">Hunter Mission</div>
        <button class="btn-play" onclick="iniciarHistoria()">INICIAR JOGO</button>
    </div>

    <div id="game-container">
        <div id="ui-camada">
            <div>FASE: <span id="fase-txt">1</span></div>
            <div id="habilidade-ui">BOLA DE FOGO (E): <span id="hab-txt">0</span>/3</div>
            <div>VIDAS: <span id="vidas-txt">3</span></div>
        </div>
        <div id="dialogo-box"></div>
        <div id="alerta-invasao">A INVASÃO COMEÇOU!</div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const dialBox = document.getElementById('dialogo-box');
        const alerta = document.getElementById('alerta-invasao');

        canvas.width = 800; canvas.height = 600;

        // --- CARREGAMENTO DE IMAGENS ---
        const skins = {
            player: new Image(), amigo: new Image(), alien: new Image(),
            chefe: new Image(), fireball: new Image()
        };
        skins.player.src = 'jogadorprincipal.png';
        skins.amigo.src = 'amigo.png';
        skins.alien.src = 'alien.png';
        skins.chefe.src = 'chefe1.png';
        skins.fireball.src = 'bola-defogo.png';

        // --- VARIÁVEIS DE ESTADO ---
        let modo = 'menu';
        let faseAtual = 1;
        let player = { x: 400, y: 450, w: 60, h: 60, tx: 400, ty: 450, rot: 0, vidas: 3, danoTime: 0, kills: 0 };
        let amigo = { x: 250, y: 450, w: 60, h: 60, tx: 250, ty: 450, rot: 0 };
        let tiros = [], tirosInimigos = [], invasores = [], particulas = [], keys = {};
        let cam = { zoom: 1, tZoom: 1 };

        function lerp(a, b, n) { return (1 - n) * a + n * b; }

        function falar(texto, tempo, callback) {
            dialBox.innerText = texto; dialBox.style.display = 'block';
            setTimeout(() => dialBox.style.opacity = 1, 50);
            setTimeout(() => { 
                dialBox.style.opacity = 0;
                setTimeout(() => { dialBox.style.display = 'none'; if(callback) callback(); }, 400);
            }, tempo);
        }

        // --- SISTEMA DE FASES ---
        function criarInvasores() {
            invasores = [];
            if (faseAtual % 5 === 0) {
                // FASE DO CHEFE (CADA 5 FASES)
                invasores.push({ x: 250, y: 60, w: 300, h: 200, hp: 200, maxHp: 200, vivo: true, isBoss: true, dir: 1, vel: 2 });
                // 5 inimigos comuns de escolta
                for(let i=0; i<5; i++) {
                    invasores.push({ x: 100 + i*130, y: 280, w: 60, h: 60, vivo: true, dir: 1, vel: 1.5 });
                }
            } else {
                // FASES NORMAIS (Início mais fácil)
                let colunas = 4 + faseAtual; 
                let linhas = 2;
                for(let i=0; i < colunas * linhas; i++) {
                    invasores.push({ 
                        x: (i % colunas) * 80 + 80, 
                        y: Math.floor(i / colunas) * 70 + 60, 
                        w: 60, h: 60, vivo: true, dir: 1, 
                        vel: 0.6 + (faseAtual * 0.2) 
                    });
                }
            }
        }

        // --- CICLO DE HISTÓRIA ---
        function iniciarHistoria() {
            document.getElementById('menu-principal').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            modo = 'historia';
            setTimeout(() => {
                cam.tZoom = 1.6;
                falar("Hunter: Eu consigo derrotar esses alienígenas sozinho!", 3000, () => {
                    amigo.tx = 330;
                    falar("Amigo: Hunter, você enlouqueceu? São muitos!", 3000, () => {
                        falar("Hunter: Vou mostrar do que sou capaz!", 2000, decolar);
                    });
                });
            }, 500);
        }

        function decolar() {
            cam.tZoom = 1;
            let subida = setInterval(() => {
                player.ty -= 8;
                for(let i=0; i<3; i++) particulas.push({ x: player.x+30, y: player.y+50, vx: (Math.random()-0.5)*4, vy: 2, life: 1, c: '#00d2ff' });
                if(player.y < -100) {
                    clearInterval(subida);
                    alerta.innerText = "FASE " + faseAtual;
                    alerta.style.display = 'block';
                    setTimeout(() => { alerta.style.display = 'none'; iniciarJogoReal(); }, 1500);
                }
            }, 16);
        }

        function iniciarJogoReal() {
            modo = 'jogando';
            player.x = 370; player.tx = 370; player.y = 520; player.ty = 520;
            tiros = []; tirosInimigos = [];
            criarInvasores();
            window.addEventListener('keydown', e => { 
                keys[e.code] = true; 
                if(e.code === 'KeyE') usarHabilidade(); 
            });
            window.addEventListener('keyup', e => keys[e.code] = false);
        }

        function usarHabilidade() {
            if(player.kills >= 3) {
                tiros.push({ x: player.x - 20, y: player.y - 40, s: 7, isFireball: true, w: 100, h: 100 });
                player.kills -= 3;
            }
        }

        // --- RENDERIZAÇÃO ---
        function drawEntity(img, obj, fallback, isPlayer, isFireball) {
            ctx.save();
            ctx.translate(obj.x + obj.w/2, obj.y + obj.h/2);
            
            if(isPlayer) {
                obj.rot = lerp(obj.rot, (obj.tx - obj.x) * 0.05, 0.1);
                ctx.rotate(obj.rot * Math.PI / 180);
                if(player.danoTime > 0) { ctx.globalAlpha = 0.5; player.danoTime--; }
            }

            if(isFireball) {
                ctx.shadowBlur = 40;
                ctx.shadowColor = "orange";
            }

            if(img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, -obj.w/2, -obj.h/2, obj.w, obj.h);
            } else {
                ctx.fillStyle = fallback;
                ctx.fillRect(-obj.w/2, -obj.h/2, obj.w, obj.h);
            }
            ctx.restore();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            cam.zoom = lerp(cam.zoom, cam.tZoom, 0.04);
            
            ctx.save();
            if(modo === 'historia') {
                ctx.translate(-(player.x * cam.zoom - 400), -(player.y * cam.zoom - 300));
                ctx.scale(cam.zoom, cam.zoom);
            }

            player.x = lerp(player.x, player.tx, 0.1);
            player.y = lerp(player.y, player.ty, 0.1);
            
            // Partículas
            particulas.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                ctx.fillStyle = p.c || `rgba(255, 100, 0, ${p.life})`;
                ctx.fillRect(p.x, p.y, 4, 4);
                if(p.life <= 0) particulas.splice(i, 1);
            });

            // Jogador e Amigo
            drawEntity(skins.player, player, '#0f0', true);
            if(modo === 'historia' && amigo.y < 700) {
                amigo.x = lerp(amigo.x, amigo.tx, 0.1);
                drawEntity(skins.amigo, amigo, '#00d2ff', false);
            }

            // Tiros do Hunter
            tiros.forEach((t, i) => {
                t.y -= t.s;
                if(t.isFireball) {
                    drawEntity(skins.fireball, t, 'orange', false, true);
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(t.x + 28, t.y, 4, 15);
                }
                if(t.y < -100) tiros.splice(i, 1);
            });

            // Tiros Inimigos
            tirosInimigos.forEach((t, i) => {
                t.y += 6;
                ctx.fillStyle = '#ff0055';
                ctx.fillRect(t.x, t.y, 5, 15);
                if(t.y > 600) tirosInimigos.splice(i, 1);

                // Colisão com o Player
                if(t.x > player.x && t.x < player.x + player.w && t.y > player.y && t.y < player.y + player.h) {
                    player.vidas--;
                    player.danoTime = 30;
                    tirosInimigos.splice(i, 1);
                    if(player.vidas <= 0) { alert("Hunter foi abatido!"); location.reload(); }
                }
            });

            if(modo === 'jogando') {
                document.getElementById('fase-txt').innerText = faseAtual;
                document.getElementById('vidas-txt').innerText = player.vidas;
                document.getElementById('hab-txt').innerText = Math.min(player.kills, 3);

                // Controles
                if(keys['ArrowLeft'] && player.tx > 10) player.tx -= 8;
                if(keys['ArrowRight'] && player.tx < 730) player.tx += 8;
                if(keys['Space'] && (tiros.length === 0 || (tiros[tiros.length-1].y < player.y - 150 && !tiros[tiros.length-1].isFireball))) {
                    tiros.push({x: player.x, y: player.y, s: 12});
                }

                let vivos = 0;
                invasores.forEach(inv => {
                    if(!inv.vivo) return;
                    vivos++;

                    // Movimento Inimigo
                    inv.x += inv.vel * inv.dir;
                    if(inv.x > (canvas.width - inv.w) || inv.x < 0) { 
                        invasores.forEach(all => { 
                            all.dir *= -1; 
                            if(!all.isBoss) all.y += 15; 
                        });
                    }

                    // Chance de atirar
                    if(Math.random() < 0.006 + (faseAtual * 0.002)) {
                        tirosInimigos.push({x: inv.x + inv.w/2, y: inv.y + inv.h});
                    }

                    // Desenhar Inimigo
                    drawEntity(inv.isBoss ? skins.chefe : skins.alien, inv, inv.isBoss ? 'purple' : 'red', false);

                    // Colisão Tiro do Hunter -> Inimigos
                    tiros.forEach((t, ti) => {
                        let rect = {x: inv.x, y: inv.y, w: inv.w, h: inv.h};
                        let hitX = t.isFireball ? t.x : t.x+28;
                        if(hitX < rect.x + rect.w && hitX + (t.w||4) > rect.x && t.y < rect.y + rect.h && t.y + (t.h||15) > rect.y) {
                            let dano = t.isFireball ? 150 : 50;
                            
                            if(inv.isBoss) {
                                inv.hp -= dano;
                                if(!t.isFireball) tiros.splice(ti, 1);
                                if(inv.hp <= 0) inv.vivo = false;
                            } else {
                                inv.vivo = false;
                                player.kills++;
                                tiros.splice(ti, 1);
                            }
                            // Efeito de explosão
                            for(let j=0; j<8; j++) particulas.push({x: hitX, y: t.y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 0.6});
                        }
                    });
                });

                // Próxima Fase
                if(vivos === 0 && invasores.length > 0) {
                    faseAtual++;
                    alerta.innerText = "FASE " + faseAtual;
                    alerta.style.display = 'block';
                    modo = 'transicao';
                    setTimeout(() => { 
                        alerta.style.display = 'none'; 
                        iniciarJogoReal(); 
                    }, 1500);
                }
            }
            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        // Iniciar
        gameLoop();
    </script>
</body>
</html>
