<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders Neon - Ultra Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --neon-blue:#00d2ff; --neon-pink:#ff0055; --neon-orange:#ffae3b; --space-dark:#050510; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%; width: 100%;}
  body{
    background: radial-gradient(circle at center, #1a1a3a 0%, var(--space-dark) 100%);
    font-family:'Plus Jakarta Sans',sans-serif;color:#fff;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  
  body::before {
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image: 
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 70% 80%, #fff, transparent),
      radial-gradient(2px 2px at 40% 60%, #aef, transparent);
    background-size:600px 600px; opacity:.4; animation: drift 100s linear infinite;
  }
  @keyframes drift{from{background-position:0 0}to{background-position:600px 600px}}

  #overlay-start {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; text-align: center; padding: 20px;
  }
  #overlay-start h2 { font-family: 'Orbitron'; color: var(--neon-blue); font-size: 32px; margin-bottom: 10px; animation: pulse 1.5s infinite; }
  #overlay-start p { font-family: 'Orbitron'; color: #fff; opacity: 0.6; font-size: 14px; }

  #menu-principal{
    text-align:center; background:rgba(5, 5, 20, 0.85);
    padding:60px; border-radius:40px; border:3px solid var(--neon-blue);
    max-width:550px; width:95%; box-shadow: 0 0 40px rgba(0, 210, 255, 0.2);
    backdrop-filter:blur(15px); position: relative; overflow: hidden; display: none;
  }
  
  #menu-principal::after {
    content: ""; position: absolute; top: -100%; left: 0; width: 100%; height: 50%;
    background: linear-gradient(to bottom, transparent, rgba(0, 210, 255, 0.05), transparent);
    animation: scan 4s linear infinite;
  }
  @keyframes scan { 0% { top: -100%; } 100% { top: 200%; } }

  h1{font-family:'Orbitron',sans-serif;font-size:48px;color:var(--neon-blue);
    text-shadow:0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue);
    margin-bottom:20px;letter-spacing:6px;}

  #menu-principal p{opacity:.8; font-size:15px; margin-bottom:35px; line-height:1.8; color: #aef; }

  .btn-play{
    padding:20px 40px; font-size:20px; font-weight:800;
    background: linear-gradient(135deg, var(--neon-pink), #ff0080); color:#fff;
    border:none; border-radius:20px; cursor:pointer; width:100%; text-transform:uppercase;
    letter-spacing:3px; box-shadow:0 10px 30px rgba(255,0,85,0.4);
    transition: all 0.3s ease; font-family:'Orbitron',sans-serif;
  }
  .btn-play:hover{ transform: scale(1.05); box-shadow:0 15px 45px rgba(255,0,85,0.6); }

  #game-container{display:none;position:relative;width:800px;height:600px;
    background:#000;border:3px solid var(--neon-blue);overflow:hidden;
    border-radius:15px;box-shadow:0 0 100px rgba(0,210,255,0.3)}

  #ui-camada{position:absolute;top:14px;left:20px;right:20px;display:flex;
    justify-content:space-between;font-family:'Orbitron',sans-serif;font-size:14px;
    color:var(--neon-blue);pointer-events:none;z-index:50;}

  #dialogo-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(255,255,255,0.98);color:#000;padding:25px 40px;border-radius:20px;
    font-weight:800;display:none;z-index:200;width:560px;text-align:center;
    border:4px solid var(--neon-blue);font-size:19px; opacity:0;transition:all 0.3s ease;}
  #dialogo-box.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}

  #efeito-tempo{position:absolute;inset:0;background:radial-gradient(circle,rgba(0,150,255,0.2),rgba(0,150,255,0.5));
    display:none;z-index:5;pointer-events:none;}
  
  #boss-hp-bar{position:absolute;top:50px;left:50%;transform:translateX(-50%);
    width:420px;height:16px;background:#111;border:2px solid #fff;display:none;
    border-radius:10px;z-index:15;overflow:hidden;}
  #boss-hp-fill{width:100%;height:100%;background:linear-gradient(90deg,#ff0055,#ffae3b);transition:width .25s ease}
  #boss-hp-label{position:absolute;top:30px;left:50%;transform:translateX(-50%);
    font-family:'Orbitron';font-size:14px;color:#ff5577;display:none;z-index:15;letter-spacing:3px}

  #game-over{position:absolute;inset:0;background:rgba(0,0,0,0.9);display:none;
    flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:20px}
  #game-over.show{display:flex}
  #game-over h2{font-family:'Orbitron';font-size:54px;color:var(--neon-pink);letter-spacing:8px}

  /* EFEITOS BOSS 3 */
  #boss3-gif {
      position: absolute; display: none; pointer-events: none; z-index: 45;
      filter: drop-shadow(0 0 15px var(--neon-pink));
  }
  .shake { animation: shakeAnim 0.1s infinite; }
  @keyframes shakeAnim {
    0% { transform: translate(3px, 3px); }
    50% { transform: translate(-3px, -3px); }
    100% { transform: translate(2px, -2px); }
  }
  .glitch-ui { animation: glitchAnim 0.2s infinite; color: #ff00ff !important; }
  @keyframes glitchAnim {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
  }
</style>
</head>
<body>

<div id="overlay-start" onclick="permitirAudio()">
  <h2>CLIQUE PARA ATIVAR O NEON</h2>
  <p>(Isso habilita a trilha sonora: menu.mp3)</p>
</div>

<div id="menu-principal">
  <h1>SPACE INVADERS</h1>
  <p>Mova com <b>A D</b> ou <b>SETAS</b><br>Atire com <b>ESPAÇO</b><br>Especial <b>(E)</b> | Escudo 2s <b>(R)</b><br>Derrote o Chefe a cada 5 níveis.</p>
  <button class="btn-play" onclick="iniciarHistoria()">INICIAR JOGO</button>
</div>

<div id="game-container">
  <div id="ui-camada">
    <div id="fase-ui">FASE: <span id="fase-txt">1</span></div>
    <div>BOLA FOGO (E): <span id="hab-txt">0</span>/3</div>
    <div>ESCUDO (R): <span id="escudo-txt">0</span>/2</div>
    <div>VIDAS: <span id="vidas-txt">3</span></div>
  </div>
  <div id="boss-hp-label">CHEFE SUPREMO</div>
  <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
  
  <img id="boss3-gif" src="chefe3.gif">

  <div id="efeito-tempo"></div>
  <div id="dialogo-box"></div>
  <div id="game-over">
    <h2>FALHA NA MISSÃO</h2>
    <p>Fase alcançada: <span id="fase-final">1</span></p>
    <button class="btn-play" style="width:auto;padding:14px 30px" onclick="location.reload()">REINICIAR SISTEMA</button>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const skins = {
    player: new Image(), amigo: new Image(), alien: new Image(),
    chefe: new Image(), chefe2: new Image(), fireball: new Image(), escudo: new Image()
};
skins.player.src = 'jogadorprincipal.png';
skins.amigo.src = 'amigo.png';
skins.alien.src = 'alien.png';
skins.chefe.src = 'chefe1.png';
skins.chefe2.src = 'chefe2.png';
skins.fireball.src = 'bola-defogo.png';
skins.escudo.src = 'escudo.png';

const somMenu = new Audio('menu.mp3');
const somTempo = new Audio('tempo.mp3');
const somTiroPlayer = new Audio('nave1.mp3');
const somTiroInimigo = new Audio('nave2.mp3');

somMenu.loop = true;
somMenu.volume = 0.5;
somTempo.volume = 0.4;
somTiroPlayer.volume = 0.3;
somTiroInimigo.volume = 0.2;

function permitirAudio() {
    document.getElementById('overlay-start').style.display = 'none';
    document.getElementById('menu-principal').style.display = 'block';
    somMenu.play().catch(error => console.error("Erro ao tocar som.", error));
    [somTempo, somTiroPlayer, somTiroInimigo].forEach(s => { s.play(); s.pause(); s.currentTime = 0; });
}

let modo = 'menu';
let faseAtual = 1;
let lastTime = performance.now();
let bossMorrendo = false;

const player = { 
    x:370, y:520, w:60, h:60, tx:370, vidas:3, 
    danoTime:0, kills:0, cooldown:0, 
    escudoAtivo: false, escudoTimer: 0 
};
const amigo  = { x:-150, y:450, w:60, h:60, tx:-150 };

let invasores = [];
let tiros = [];
let tirosE = [];
let particulas = [];
const keys = {};
let frameAnim = 0;

const $ = id => document.getElementById(id);

function falar(texto, tempo, cb){
  const box = $('dialogo-box');
  box.innerText = texto;
  box.classList.add('show');
  setTimeout(()=>{ box.classList.remove('show'); cb && cb(); }, tempo);
}

function iniciarHistoria(){
  somMenu.pause(); 
  $('menu-principal').style.display='none';
  $('game-container').style.display='block';
  modo='historia';
  amigo.tx = 200; player.tx = 500;
  falar("Hunter: Eu consigo derrotar esses alienígenas sozinho!", 2200, ()=>{
    falar("Amigo: Hunter, você enlouqueceu? São muitos!", 2200, ()=>{
      falar("Hunter: Vou mostrar do que sou capaz!", 1500, ()=>{
        modo='jogando';
        amigo.tx = -200; player.tx = 370;
        criarFase();
      });
    });
  });
}

function criarFase(){
  invasores=[]; tiros=[]; tirosE=[]; bossMorrendo = false;
  player.escudoAtivo = false; player.escudoTimer = 0;
  const bossBar = $('boss-hp-bar'), bossLabel = $('boss-hp-label'), container = $('game-container');
  const bossGif = $('boss3-gif');
  const ui = $('ui-camada');
  
  bossBar.style.display='none'; bossLabel.style.display='none'; bossGif.style.display='none';
  container.classList.remove('shake');
  ui.classList.remove('glitch-ui');

  if(faseAtual % 15 === 0){ // NOVO BOSS 3 (Fase 15)
      bossBar.style.display='block'; bossLabel.style.display='block';
      bossLabel.innerText = "MK-III: ERRO DE SISTEMA";
      $('boss-hp-fill').style.width='100%';
      invasores.push({ x:300, y:80, w:220, h:220, hp:8000, maxHp:8000, isBoss:true, tipo:3, dir:1, vel:2.8 });
      falar("SISTEMA: Realidade corrompida detectada.", 3000);
  }
  else if(faseAtual % 10 === 0){ // BOSS 2 (Fase 10)
    bossBar.style.display='block'; bossLabel.style.display='block';
    bossLabel.innerText = "MK-II: O ANULADOR";
    $('boss-hp-fill').style.width='100%';
    invasores.push({ x:300, y:80, w:180, h:150, hp:5000, maxHp:5000, isBoss:true, tipo:2, dir:1, vel:3.2 });
    invasores.push({ x:260, y:60, w:250, h:190, hp:400, maxHp:400, isShield:true });
  } 
  else if(faseAtual % 5 === 0){ // BOSS 1 (Fase 5)
    bossBar.style.display='block'; bossLabel.style.display='block';
    bossLabel.innerText = "CHEFE SUPREMO";
    $('boss-hp-fill').style.width='100%';
    const bossHp = 5000 + faseAtual*200; 
    invasores.push({ x:300, y:80, w:200, h:160, hp:bossHp, maxHp:bossHp, isBoss:true, tipo:1, dir:1, vel:1.4 });
    invasores.push({ x:260, y:60, w:280, h:200, hp:400, maxHp:400, isShield:true });
  } else {
    const rows = 2 + Math.min(2, Math.floor(faseAtual/3));
    for(let r=0;r<rows;r++){
      for(let c=0;c<5;c++){
        invasores.push({ x: c*110 + 130, y: r*70 + 70, w:55, h:55, vivo:true, dir:1, vel: 0.8 + faseAtual*0.15 });
      }
    }
  }
}

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(modo==='jogando' && !bossMorrendo) {
      if(e.code === 'KeyE' && player.kills >= 3){
        tiros.push({ x: player.x + player.w/2 - 25, y: player.y - 20, w:50, h:50, s:9, isFireball:true });
        player.kills -= 3;
      }
      if(e.code === 'KeyR' && player.kills >= 2 && !player.escudoAtivo){
        player.escudoAtivo = true; player.escudoTimer = 2000; player.kills -= 2;
      }
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function explodir(x,y,color){
  for(let i=0;i<12;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 1 + Math.random()*3;
    particulas.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:30, color });
  }
}

function desenharNave(obj, color, isPlayer){
  ctx.save();
  const cx = obj.x + obj.w/2, cy = obj.y + obj.h/2;
  const flutua = Math.sin(frameAnim*0.08 + obj.x*0.05) * 3;
  ctx.translate(cx, cy + flutua);
  if(isPlayer && player.danoTime > 0 && Math.floor(player.danoTime/4)%2) ctx.globalAlpha = 0.4;
  const img = isPlayer ? skins.player : (obj.x === amigo.x ? skins.amigo : skins.alien);
  ctx.drawImage(img, -obj.w/2, -obj.h/2, obj.w, obj.h);
  if(isPlayer && player.escudoAtivo) {
      ctx.restore(); ctx.save();
      ctx.translate(cx, cy + flutua);
      ctx.globalAlpha = 0.6 + Math.sin(frameAnim*0.2)*0.2;
      ctx.drawImage(skins.escudo, -obj.w*0.8, -obj.h*0.8, obj.w*1.6, obj.h*1.6);
  }
  ctx.restore();
}

function gameLoop(now){
  const dt = Math.min(32, now - lastTime);
  lastTime = now; frameAnim += dt * 0.06;
  ctx.clearRect(0,0,800,600);

  if(modo === 'menu') { requestAnimationFrame(gameLoop); return; }

  const lerp = 1 - Math.pow(0.001, dt/1000);
  player.x += (player.tx - player.x) * lerp;
  amigo.x  += (amigo.tx  - amigo.x ) * lerp;

  if(player.danoTime>0) player.danoTime -= dt/16;
  if(player.cooldown>0) player.cooldown -= dt;
  if(player.escudoAtivo){
      player.escudoTimer -= dt;
      if(player.escudoTimer <= 0) player.escudoAtivo = false;
  }

  if(amigo.x > -100) desenharNave(amigo, '#00d2ff', false);
  desenharNave(player, '#00ff88', true);

  if(modo !== 'jogando'){ requestAnimationFrame(gameLoop); return; }

  $('fase-txt').innerText = faseAtual;
  $('vidas-txt').innerText = player.vidas;
  $('hab-txt').innerText = Math.min(player.kills,3);
  $('escudo-txt').innerText = Math.min(player.kills,2);

  const boss = invasores.find(i=>i.isBoss && i.hp>0);
  const shield = invasores.find(i=>i.isShield && i.hp>0);

  // BOSS 3 GIF E EFEITOS
  if(boss && boss.tipo === 3){
      const gif = $('boss3-gif');
      gif.style.display = 'block';
      gif.style.left = (canvas.offsetLeft + boss.x) + "px";
      gif.style.top = (canvas.offsetTop + boss.y) + "px";
      gif.style.width = boss.w + "px";
      if(boss.hp < 5000) $('game-container').classList.add('shake');
      if(boss.hp < 2500) $('ui-camada').classList.add('glitch-ui');
  }

  // BOSS 2 IA ESQUIVA
  if(boss && boss.tipo === 2 && !bossMorrendo){
      tiros.forEach(t => {
          if(!t.isFireball && Math.abs(t.x - (boss.x + boss.w/2)) < 110 && t.y > boss.y){
              boss.x += (t.x < boss.x + boss.w/2) ? 7.5 : -7.5;
          }
      });
  }

  if(!bossMorrendo){
    const speed = 0.5 * dt;
    if((keys['ArrowLeft'] || keys['KeyA'])  && player.tx > 10)  player.tx -= speed;
    if((keys['ArrowRight'] || keys['KeyD']) && player.tx < 730) player.tx += speed;
    if(keys['Space'] && player.cooldown <= 0){
      tiros.push({ x: player.x + player.w/2 - 3, y: player.y, w:6, h:18, s:11 });
      player.cooldown = 220; somTiroPlayer.currentTime = 0; somTiroPlayer.play();
    }
  }

  for(let i=tiros.length-1;i>=0;i--){
    tiros[i].y -= tiros[i].s * (dt/16);
    if(tiros[i].y < -100) tiros.splice(i,1);
  }

  let vivos = 0; let edge = false;
  invasores.forEach(inv=>{
    if(inv.isBoss ? inv.hp<=0 : (inv.isShield ? inv.hp<=0 : !inv.vivo)) return;
    if(!inv.isShield) vivos++;
    if(!bossMorrendo){
       if(inv.isShield && boss){ inv.x = boss.x + boss.w/2 - inv.w/2; inv.y = boss.y + boss.h/2 - inv.h/2; }
       else {
         inv.x += inv.vel * inv.dir * (dt/16);
         if(inv.x > 790 - inv.w || inv.x < 10) edge = true;
         if(Math.random() < (inv.isBoss ? 0.03 : 0.005) * (dt/16)) {
            tirosE.push({ x: inv.x + inv.w/2, y: inv.y + inv.h, s: 5 });
            somTiroInimigo.currentTime = 0; somTiroInimigo.play();
         }
       }
    }
  });

  if(edge){ invasores.forEach(e=>{ if(!e.isShield){ e.dir *= -1; if(!e.isBoss) e.y += 10; } }); }

  for(let i=tirosE.length-1;i>=0;i--){
    const te = tirosE[i]; te.y += te.s * (dt/16);
    if(te.x < player.x+player.w && te.x+5 > player.x && te.y < player.y+player.h && te.y+15 > player.y){
        if(player.escudoAtivo) { tirosE.splice(i,1); }
        else if(player.danoTime <= 0) {
            player.vidas--; player.danoTime = 60; tirosE.splice(i,1);
            if(player.vidas <= 0){ modo = 'gameover'; $('fase-final').innerText = faseAtual; $('game-over').classList.add('show'); }
        }
    } else if(te.y > 620) tirosE.splice(i,1);
  }

  for(let ti=tiros.length-1; ti>=0; ti--){
    const t = tiros[ti];
    for(const inv of invasores){
      const alive = inv.isBoss ? inv.hp>0 : (inv.isShield ? inv.hp>0 : inv.vivo);
      if(!alive) continue;
      if(t.x < inv.x+inv.w && t.x+t.w > inv.x && t.y < inv.y+inv.h && t.y+t.h > inv.y){
          if(t.isFireball){
            if(inv.isBoss || inv.isShield) inv.hp -= 45;
            else { inv.vivo = false; player.kills++; }
          } else {
            if(inv.isShield) { inv.hp -= 50; tiros.splice(ti,1); break; }
            else if(inv.isBoss) { if(!shield) inv.hp -= 50; tiros.splice(ti,1); break; }
            else { inv.vivo = false; player.kills++; tiros.splice(ti,1); break; }
          }
      }
    }
  }

  if(boss) $('boss-hp-fill').style.width = Math.max(0,(boss.hp/boss.maxHp)*100)+'%';
  if(vivos === 0 && !bossMorrendo){ faseAtual++; criarFase(); }

  invasores.forEach(inv=>{
    if(inv.isBoss){ if(inv.tipo !== 3) ctx.drawImage(inv.tipo===2?skins.chefe2:skins.chefe, inv.x, inv.y, inv.w, inv.h); }
    else if(inv.isShield){ if(inv.hp>0) { ctx.globalAlpha=0.3; ctx.drawImage(skins.escudo, inv.x, inv.y, inv.w, inv.h); ctx.globalAlpha=1; } }
    else if(inv.vivo) ctx.drawImage(skins.alien, inv.x, inv.y, inv.w, inv.h);
  });
  
  tiros.forEach(t=> t.isFireball ? ctx.drawImage(skins.fireball, t.x, t.y, t.w, t.h) : (ctx.fillStyle='#fff', ctx.fillRect(t.x, t.y, t.w, t.h)));
  tirosE.forEach(te=>(ctx.fillStyle='#ff0055', ctx.fillRect(te.x, te.y, 5, 15)));
  
  particulas.forEach((p,i)=>{
    p.x += p.vx; p.y += p.vy; p.life--;
    if(p.life<=0) particulas.splice(i,1);
    else { ctx.globalAlpha = p.life/30; ctx.fillStyle = p.color; ctx.fillRect(p.x,p.y,3,3); ctx.globalAlpha = 1; }
  });

  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
