<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Space Invaders Neon - Hunter Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --neon-blue:#00d2ff; --neon-pink:#ff0055; --space-dark:#050510; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(ellipse at top,#0a0a25 0%,var(--space-dark) 70%);font-family:'Plus Jakarta Sans',sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #menu-principal{text-align:center;background:rgba(10,10,30,.92);padding:50px;border-radius:30px;border:2px solid var(--neon-blue);width:480px;box-shadow:0 0 60px rgba(0,210,255,.3);}
  h1{font-family:'Orbitron',sans-serif;font-size:42px;color:var(--neon-blue);margin-bottom:15px;letter-spacing:4px;}
  .btn-play{padding:18px 30px;font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--neon-pink),#ff3380);color:#fff;border:none;border-radius:16px;cursor:pointer;width:100%;text-transform:uppercase;font-family:'Orbitron',sans-serif;transition:0.2s;}
  .btn-play:hover{transform:scale(1.02);filter:brightness(1.2);}
  #game-container{display:none;position:relative;width:800px;height:600px;background:#000;border:3px solid var(--neon-blue);border-radius:8px;overflow:hidden;}
  #ui-camada{position:absolute;top:15px;left:20px;right:20px;display:flex;justify-content:space-between;font-family:'Orbitron',sans-serif;color:var(--neon-blue);z-index:50;}
  #dialogo-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:25px;border-radius:15px;font-weight:800;display:none;z-index:200;text-align:center;border:4px solid var(--neon-blue);width:500px;}
  #dialogo-box.show{display:block;}
  #efeito-tempo{position:absolute;inset:0;background:radial-gradient(circle,rgba(0,150,255,0.2),rgba(0,150,255,0.5));display:none;z-index:5;}
  #boss-hp-bar{position:absolute;top:50px;left:50%;transform:translateX(-50%);width:400px;height:12px;background:#222;border:1px solid #fff;display:none;border-radius:6px;overflow:hidden;}
  #boss-hp-fill{width:100%;height:100%;background:linear-gradient(90deg,#ff0055,#ffae3b);transition:0.2s;}
  #game-over{position:absolute;inset:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;}
  #game-over.show{display:flex;}
</style>
</head>
<body>

<div id="menu-principal">
  <h1>SPACE INVADERS</h1>
  <p style="margin-bottom:25px;opacity:0.8">SETAS ou A D para mover · ESPAÇO atirar · E especial</p>
  <button class="btn-play" onclick="iniciarHistoria()">INICIAR JOGO</button>
</div>

<div id="game-container">
  <div id="ui-camada">
    <div>FASE: <span id="fase-txt">1</span></div>
    <div>ESPECIAL: <span id="hab-txt">0</span>/3</div>
    <div>VIDAS: <span id="vidas-txt">3</span></div>
  </div>
  <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
  <div id="efeito-tempo"></div>
  <div id="dialogo-box"></div>
  <div id="game-over">
    <h2 style="color:var(--neon-pink);font-family:'Orbitron';font-size:40px">GAME OVER</h2>
    <button class="btn-play" style="width:200px;margin-top:20px" onclick="location.reload()">RECOMECAR</button>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d'), $ = id => document.getElementById(id);
const skins = { player: new Image(), amigo: new Image(), alien: new Image(), chefe: new Image(), fireball: new Image(), escudo: new Image() };
skins.player.src = 'jogadorprincipal.png'; skins.amigo.src = 'amigo.png'; skins.alien.src = 'alien.png';
skins.chefe.src = 'chefe1.png'; skins.fireball.src = 'bola-defogo.png'; skins.escudo.src = 'escudo.png';

// SONS COM VOLUME REDUZIDO
const somMenu = new Audio('menu.mp3'); somMenu.loop = true; somMenu.volume = 0.3;
const somTiroPlayer = new Audio('nave1.mp3'); somTiroPlayer.volume = 0.2;
const somTiroInimigo = new Audio('nave2.mp3'); somTiroInimigo.volume = 0.15;
const somTempo = new Audio('tempo.mp3'); somTempo.volume = 0.4;

window.onclick = () => { if(modo === 'menu') somMenu.play(); };

let modo = 'menu', faseAtual = 1, tempoParado = false, contadorTempo = 0, lastTime = performance.now();
let player = { x:370, y:520, w:60, h:60, tx:370, vidas:3, danoTime:0, kills:0, cooldown:0 };
let invasores = [], tiros = [], tirosE = [], keys = {}, avisando = false;
const falas = ["ZA WARUDO!", "O tempo parou!", "Inútil!", "Morra, Hunter!"];

function falar(txt, tempo, cb){
  const b = $('dialogo-box'); b.innerText = txt; b.classList.add('show');
  setTimeout(() => { b.classList.remove('show'); cb && cb(); }, tempo);
}

function iniciarHistoria(){
  somMenu.pause(); modo = 'historia'; $('menu-principal').style.display='none'; $('game-container').style.display='block';
  falar("Hunter: Eu consigo derrotar esses alienígenas sozinho!", 2000, () => {
    falar("Amigo: Hunter, você enlouqueceu? São muitos!", 2000, () => {
      modo = 'jogando'; criarFase();
    });
  });
}

function criarFase(){
  invasores = []; tiros = []; tirosE = []; avisando = false; tempoParado = false;
  if(faseAtual % 5 === 0){
    $('boss-hp-bar').style.display = 'block';
    const hp = 5000 + (faseAtual * 200);
    invasores.push({ x:300, y:80, w:180, h:140, hp:hp, maxHp:hp, isBoss:true, dir:1, vel:1.6 });
    invasores.push({ x:260, y:60, w:260, h:180, hp:600, isShield:true });
    contadorTempo = 0;
  } else {
    $('boss-hp-bar').style.display = 'none';
    for(let r=0; r<3; r++) for(let c=0; c<7; c++) invasores.push({ x:c*90+100, y:r*60+60, w:50, h:50, vivo:true, dir:1, vel:0.7+(faseAtual*0.1) });
  }
}

window.onkeydown = e => { keys[e.code] = true; if(e.code === 'KeyE' && !tempoParado) usarEspecial(); };
window.onkeyup = e => keys[e.code] = false;

function usarEspecial(){ if(player.kills >= 3){ tiros.push({ x:player.x, y:player.y-30, w:60, h:60, s:7, isFireball:true }); player.kills -= 3; } }

function gameLoop(now){
  const dt = now - lastTime; lastTime = now;
  ctx.clearRect(0,0,800,600);
  if(modo === 'menu') return requestAnimationFrame(gameLoop);

  player.x += (player.tx - player.x) * 0.12;
  if(player.danoTime > 0) player.danoTime--;
  if(player.cooldown > 0) player.cooldown -= dt;

  // DESENHO
  invasores.forEach(inv => {
    if(inv.hp <= 0 || (inv.vivo === false)) return;
    ctx.save(); ctx.translate(inv.x+inv.w/2, inv.y+inv.h/2);
    if(!inv.isBoss && !inv.isShield) ctx.rotate(inv.dir * 0.12); // Inclinação estética
    ctx.drawImage(inv.isBoss ? skins.chefe : (inv.isShield ? skins.escudo : skins.alien), -inv.w/2, -inv.h/2, inv.w, inv.h);
    ctx.restore();
  });
  ctx.globalAlpha = (player.danoTime % 2 === 0) ? 1 : 0.5;
  ctx.drawImage(skins.player, player.x, player.y, player.w, player.h);
  ctx.globalAlpha = 1;

  if(modo !== 'jogando') return requestAnimationFrame(gameLoop);

  const boss = invasores.find(i => i.isBoss && i.hp > 0);
  const shield = invasores.find(i => i.isShield && i.hp > 0);

  // LÓGICA ZA WARUDO
  if(boss && !tempoParado && !avisando){
    contadorTempo += dt/1000;
    if(contadorTempo >= 6){
      avisando = true;
      falar(falas[Math.floor(Math.random()*falas.length)], 1000, () => {
        tempoParado = true; somTempo.play(); $('efeito-tempo').style.display = 'block';
        setTimeout(() => { tempoParado = false; avisando = false; contadorTempo = 0; $('efeito-tempo').style.display = 'none'; }, 3000);
      });
    }
  }

  // CONTROLES HUNTER (TRAVA NO GELO)
  if(!tempoParado){
    if(keys['ArrowLeft'] || keys['KeyA']) player.tx = Math.max(0, player.tx - 7);
    if(keys['ArrowRight'] || keys['KeyD']) player.tx = Math.min(740, player.tx + 7);
    if(keys['Space'] && player.cooldown <= 0){
      tiros.push({ x:player.x+player.w/2-3, y:player.y, w:6, h:15, s:12 });
      player.cooldown = 200; somTiroPlayer.currentTime=0; somTiroPlayer.play();
    }
  }

  // TIROS PLAYER
  for(let i=tiros.length-1; i>=0; i--){
    let t = tiros[i]; t.y -= t.s;
    invasores.forEach(inv => {
      if((inv.hp > 0 || inv.vivo) && t.x < inv.x+inv.w && t.x+t.w > inv.x && t.y < inv.y+inv.h && t.y+20 > inv.y){
        if(t.isFireball){ if(inv.isBoss || inv.isShield) inv.hp -= 25; else inv.vivo = false; }
        else {
          if(inv.isShield) inv.hp -= 40; else if(inv.isBoss) inv.hp -= 15; else { inv.vivo = false; player.kills++; }
          tiros.splice(i,1);
        }
      }
    });
    if(t.y < -50) tiros.splice(i,1);
    else if(t.isFireball) ctx.drawImage(skins.fireball, t.x, t.y, t.w, t.h);
    else { ctx.fillStyle = '#fff'; ctx.fillRect(t.x, t.y, t.w, t.h); }
  }

  // MOVIMENTO INVASORES (BOSS SE MOVE NO GELO)
  let vivos = 0;
  invasores.forEach(inv => {
    if(inv.isBoss ? inv.hp > 0 : (inv.isShield ? inv.hp > 0 : inv.vivo)){
      if(!inv.isShield) vivos++;
      if(!inv.isShield){
        inv.x += inv.vel * inv.dir;
        if(inv.x > 750 || inv.x < 10) inv.dir *= -1;
        if(Math.random() < 0.01) {
          tirosE.push({ x:inv.x+inv.w/2, y:inv.y+inv.h, w:5, h:12 });
          somTiroInimigo.currentTime=0; somTiroInimigo.play();
        }
      } else if(boss) { inv.x = boss.x-40; inv.y = boss.y-20; }
    }
  });

  // TIROS INIMIGOS
  for(let i=tirosE.length-1; i>=0; i--){
    let te = tirosE[i]; te.y += 6;
    if(te.x < player.x+player.w && te.x+te.w > player.x && te.y < player.y+player.h && te.y+12 > player.y && player.danoTime <= 0){
      player.vidas--; player.danoTime = 60; tirosE.splice(i,1);
      if(player.vidas <= 0) { modo = 'gameover'; $('game-over').classList.add('show'); }
    }
    ctx.fillStyle = '#f00'; ctx.fillRect(te.x, te.y, te.w, te.h);
    if(te.y > 600) tirosE.splice(i,1);
  }

  if(boss) $('boss-hp-fill').style.width = (boss.hp/boss.maxHp)*100 + '%';
  $('fase-txt').innerText = faseAtual; $('vidas-txt').innerText = player.vidas; $('hab-txt').innerText = Math.min(player.kills, 3);
  if(vivos === 0) { faseAtual++; criarFase(); }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
