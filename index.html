<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders Neon - Ultra Edition</title>

<link rel="icon" href="data:,">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>

:root{
 --neon-blue:#00d2ff;
 --neon-pink:#ff0055;
 --neon-orange:#ffae3b;
 --space-dark:#050510;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
}

body{
 background:radial-gradient(circle at center,#1a1a3a 0%,#050510 100%);
 font-family:'Plus Jakarta Sans',sans-serif;
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;
 overflow:hidden;
}

body::before{
 content:'';
 position:fixed;
 inset:0;
 pointer-events:none;
 background-image:
 radial-gradient(1px 1px at 20% 30%,#fff,transparent),
 radial-gradient(1px 1px at 70% 80%,#fff,transparent),
 radial-gradient(2px 2px at 40% 60%,#00d2ff,transparent);
 background-size:600px 600px;
 opacity:.4;
 animation:drift 100s linear infinite;
}

@keyframes drift{
 from{background-position:0 0;}
 to{background-position:600px 600px;}
}

#overlay-start{
 position:fixed;
 inset:0;
 background:black;
 z-index:9999;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 cursor:pointer;
}

#overlay-start h2{
 font-size:38px;
 color:#00d2ff;
 font-family:'Orbitron';
 text-shadow:0 0 20px #00d2ff;
 animation:pulse 1.5s infinite;
}

#overlay-start p{
 margin-top:15px;
 opacity:.7;
}

@keyframes pulse{
 0%{transform:scale(1);}
 50%{transform:scale(1.05);}
 100%{transform:scale(1);}
}

#menu-principal{
 display:none;
 width:95%;
 max-width:650px;
 background:rgba(5,5,20,.88);
 border:3px solid #00d2ff;
 border-radius:35px;
 padding:50px;
 text-align:center;
 backdrop-filter:blur(15px);
 box-shadow:0 0 50px rgba(0,210,255,.3);
 position:relative;
 overflow:hidden;
}

#menu-principal::after{
 content:'';
 position:absolute;
 top:-100%;
 left:0;
 width:100%;
 height:50%;
 background:linear-gradient(to bottom,
 transparent,
 rgba(0,210,255,.08),
 transparent);
 animation:scan 4s linear infinite;
}

@keyframes scan{
 0%{top:-100%;}
 100%{top:200%;}
}

h1{
 font-size:54px;
 font-family:'Orbitron';
 letter-spacing:8px;
 color:#00d2ff;
 text-shadow:
 0 0 20px #00d2ff,
 0 0 40px #00d2ff;
 margin-bottom:25px;
}

.btn-play{
 width:100%;
 padding:20px;
 border:none;
 border-radius:18px;
 font-size:22px;
 font-family:'Orbitron';
 font-weight:900;
 cursor:pointer;
 color:white;
 background:linear-gradient(135deg,#ff0055,#ff3c8d);
 box-shadow:0 10px 40px rgba(255,0,85,.5);
 transition:.3s;
}

.btn-play:hover{
 transform:scale(1.04);
}

#game-container{
 display:none;
 position:relative;
 width:800px;
 height:600px;
 background:black;
 border:3px solid #00d2ff;
 border-radius:15px;
 overflow:hidden;
 box-shadow:0 0 100px rgba(0,210,255,.3);
}

#ui-camada{
 position:absolute;
 top:14px;
 left:20px;
 right:20px;
 display:flex;
 justify-content:space-between;
 font-family:'Orbitron';
 z-index:200;
 color:#00d2ff;
}

#dialogo-box{
 position:absolute;
 bottom:25px;
 left:50%;
 transform:translateX(-50%);
 width:700px;
 max-width:92%;
 background:rgba(0,0,0,.82);
 border:2px solid #00d2ff;
 border-radius:20px;
 padding:18px 25px;
 text-align:center;
 font-size:20px;
 font-family:'Orbitron';
 z-index:500;
 display:none;
}

#dialogo-box.show{
 display:block;
 animation:fadeDialog .25s ease;
}

@keyframes fadeDialog{
 from{
   opacity:0;
   transform:translateX(-50%) translateY(15px);
 }
 to{
   opacity:1;
   transform:translateX(-50%) translateY(0);
 }
}

#efeito-tempo{
 position:absolute;
 inset:0;
 background:rgba(100,200,255,.25);
 display:none;
 z-index:50;
 pointer-events:none;
 backdrop-filter:blur(2px);
}

#boss-hp-bar{
 position:absolute;
 top:50px;
 left:50%;
 transform:translateX(-50%);
 width:420px;
 height:16px;
 background:#111;
 border:2px solid white;
 border-radius:10px;
 overflow:hidden;
 display:none;
 z-index:300;
}

#boss-hp-fill{
 width:100%;
 height:100%;
 background:linear-gradient(90deg,#ff0055,#ffae3b);
}

#game-over{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,.9);
 display:none;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 z-index:999;
}

canvas{
 display:block;
}

</style>
</head>
<body>

<div id="overlay-start" onclick="permitirAudio()">
<h2>CLIQUE PARA ATIVAR O NEON</h2>
<p>Ativa sons e trilha sonora</p>
</div>

<div id="menu-principal">
<h1>SPACE INVADERS</h1>

<p>
A/D ou SETAS para mover<br>
ESPAÇO para atirar<br>
E = Bola de fogo<br>
R = Escudo
</p>

<button class="btn-play" onclick="iniciarHistoria()">
INICIAR MISSÃO
</button>
</div>

<div id="game-container">

<div id="ui-camada">
<div>FASE: <span id="fase-txt">1</span></div>
<div>KILLS: <span id="kills-txt">0</span></div>
<div>VIDAS: <span id="vidas-txt">3</span></div>
</div>

<div id="boss-hp-bar">
<div id="boss-hp-fill"></div>
</div>

<div id="efeito-tempo"></div>

<div id="dialogo-box"></div>

<div id="game-over">
<h1>GAME OVER</h1>
<button class="btn-play" onclick="location.reload()">
REINICIAR
</button>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

</div>

<script>

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const $ = id => document.getElementById(id);

const somMenu = new Audio('menu.mp3');
const somTempo = new Audio('tempo.mp3');
const somTiro = new Audio('nave1.mp3');

somMenu.loop = true;

function permitirAudio(){
 $('overlay-start').style.display='none';
 $('menu-principal').style.display='block';

 somMenu.play();

 somTempo.play();
 somTempo.pause();
 somTempo.currentTime = 0;
}

const player = {
 x:370,
 y:500,
 w:60,
 h:60,
 vidas:3,
 kills:0,
 cooldown:0,
 escudo:false,
 escudoTimer:0
};

const amigo = {
 x:-200,
 y:430,
 w:60,
 h:60
};

let tiros = [];
let inimigos = [];
let tempoParado = false;
let faseAtual = 1;
let modo = 'menu';
let lastTime = performance.now();

const keys = {};

const falasChefe = [
 'ZA WARUDO!',
 'O TEMPO PAROU!',
 'VOCÊ NÃO PODE SE MOVER!',
 'INÚTIL!'
];

function falar(texto,tempo=2000){
 const box = $('dialogo-box');

 box.innerText = texto;

 box.classList.add('show');

 setTimeout(()=>{
  box.classList.remove('show');
 },tempo);
}

function iniciarHistoria(){

 somMenu.pause();

 $('menu-principal').style.display='none';
 $('game-container').style.display='block';

 modo='historia';

 amigo.x = 120;

 falar('Amigo: Hunter... tome cuidado...',2500);

 setTimeout(()=>{

  falar('Hunter: Eu vou acabar com todos eles.',2500);

 },3000);

 setTimeout(()=>{

  falar('Hunter: ADEUS MEU AMIGO!',2500);

 },6000);

 setTimeout(()=>{

  iniciarAnimacaoSubida();

 },9000);

}

function iniciarAnimacaoSubida(){

 let intervalo = setInterval(()=>{

  player.y -= 4;

  if(player.y < -120){

   clearInterval(intervalo);

   falar('A INVASÃO COMEÇOU!',3000);

   setTimeout(()=>{
    modo='jogando';
    criarFase();
   },2500);

  }

 },16);

}

function criarFase(){

 inimigos = [];

 $('fase-txt').innerText = faseAtual;

 if(faseAtual % 10 === 0){

  $('boss-hp-bar').style.display='block';

  inimigos.push({
   x:250,
   y:80,
   w:220,
   h:170,
   hp:12000,
   maxHp:12000,
   boss:2,
   dir:1
  });

 }

 else if(faseAtual % 5 === 0){

  $('boss-hp-bar').style.display='block';

  inimigos.push({
   x:280,
   y:80,
   w:200,
   h:150,
   hp:7000,
   maxHp:7000,
   boss:1,
   dir:1,
   tempoCooldown:0
  });

 }

 else{

  $('boss-hp-bar').style.display='none';

  for(let i=0;i<10;i++){

   inimigos.push({
    x:80 + (i%5)*120,
    y:70 + Math.floor(i/5)*80,
    w:50,
    h:50,
    hp:1,
    dir:1
   });

  }

 }

}

window.addEventListener('keydown',e=>{

 keys[e.code]=true;

 if(e.code==='Space' && player.cooldown<=0 && !tempoParado){

  tiros.push({
   x:player.x+28,
   y:player.y,
   w:6,
   h:18
  });

  player.cooldown = 250;

  somTiro.currentTime = 0;
  somTiro.play();

 }

});

window.addEventListener('keyup',e=>{
 keys[e.code]=false;
});

function ativarZaWarudo(boss){

 if(tempoParado) return;

 tempoParado = true;

 $('efeito-tempo').style.display='block';

 somTempo.currentTime = 0;
 somTempo.play();

 const frase = falasChefe[Math.floor(Math.random()*falasChefe.length)];

 falar(frase,3000);

 setTimeout(()=>{

  tempoParado = false;

  $('efeito-tempo').style.display='none';

 },4000);

}

function desenharPlayer(){

 ctx.fillStyle='#00ff88';

 ctx.beginPath();

 ctx.moveTo(player.x+30,player.y);
 ctx.lineTo(player.x+60,player.y+60);
 ctx.lineTo(player.x,player.y+60);

 ctx.fill();

}

function desenharAmigo(){

 ctx.fillStyle='#00d2ff';

 ctx.fillRect(amigo.x,amigo.y,60,60);

}

function desenharInimigo(i){

 if(i.boss===1){

  ctx.fillStyle='#ff0055';

  ctx.fillRect(i.x,i.y,i.w,i.h);

 }

 else if(i.boss===2){

  ctx.fillStyle='#777';

  ctx.fillRect(i.x,i.y,i.w,i.h);

 }

 else{

  ctx.fillStyle='red';

  ctx.fillRect(i.x,i.y,i.w,i.h);

 }

}

function colisao(a,b){

 return(
  a.x < b.x+b.w &&
  a.x+a.w > b.x &&
  a.y < b.y+b.h &&
  a.y+a.h > b.y
 );

}

function gameLoop(now){

 const dt = now - lastTime;

 lastTime = now;

 ctx.clearRect(0,0,800,600);

 if(player.cooldown>0){
  player.cooldown -= dt;
 }

 if(keys['ArrowLeft'] || keys['KeyA']){
  if(!tempoParado) player.x -= 5;
 }

 if(keys['ArrowRight'] || keys['KeyD']){
  if(!tempoParado) player.x += 5;
 }

 if(amigo.x > -100 && modo==='historia'){
  desenharAmigo();
 }

 desenharPlayer();

 tiros.forEach((t,i)=>{

  if(!tempoParado){
   t.y -= 10;
  }

  ctx.fillStyle='white';
  ctx.fillRect(t.x,t.y,t.w,t.h);

  inimigos.forEach((enemy,index)=>{

   if(colisao(t,enemy)){

    if(enemy.boss===2){

     tiros.splice(i,1);

     return;

    }

    enemy.hp -= 50;

    tiros.splice(i,1);

    if(enemy.hp<=0){

     inimigos.splice(index,1);

     player.kills++;

     $('kills-txt').innerText = player.kills;

    }

   }

  });

 });

 inimigos.forEach(enemy=>{

  if(enemy.boss===2){

   enemy.x += Math.sin(now*0.01)*3;

   tiros.forEach(t=>{

    if(Math.abs(t.x-enemy.x)<100){

     enemy.x += (t.x < enemy.x) ? 5 : -5;

    }

   });

  }

  if(enemy.boss===1){

   enemy.tempoCooldown ??= 0;

   enemy.tempoCooldown += dt;

   if(enemy.tempoCooldown > 8000){

    enemy.tempoCooldown = 0;

    ativarZaWarudo(enemy);

   }

  }

  desenharInimigo(enemy);

 });

 if(inimigos.length===0 && modo==='jogando'){

  faseAtual++;

  criarFase();

 }

 requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
