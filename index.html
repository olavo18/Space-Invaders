<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders - Olavo Marchiori</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --neon-blue: #00d2ff;
    --neon-pink: #ff0055;
    --space-dark: #050510;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background-color: var(--space-dark);
    background-image: radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 20px);
    background-size: 50px 50px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: white;
    height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* MENU ORIGINAL RESTAURADO */
#menu-principal {
    text-align: center;
    background: rgba(10, 10, 30, 0.95);
    padding: 50px;
    border-radius: 40px;
    border: 2px solid var(--neon-blue);
    backdrop-filter: blur(15px);
    z-index: 100;
    max-width: 450px;
    width: 90%;
    box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
    animation: floating 4s infinite ease-in-out;
}

@keyframes floating {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

h1 { font-family: 'Orbitron'; font-size: 32px; color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); }
.subtitle { margin-bottom: 40px; }

.btn-menu {
    padding: 16px 25px;
    font-weight: 800;
    border-radius: 15px;
    cursor: pointer;
    margin: 10px;
}

/* GAME */
#game-container { 
    display:none;
    position:relative;
    width:800px;
    height:600px;
    background:#000;
    border:2px solid var(--neon-blue);
}

/* LEGENDA FIX */
#dialogo-box {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    color:white;
    padding:18px;
    border-radius:15px;
    display:none;
    opacity:0;
    transition:0.4s;
    width:70%;
    text-align:center;
}

#alerta-invasao {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:var(--neon-pink);
    font-size:50px;
    display:none;
}
</style>
</head>

<body>

<div id="menu-principal">
    <h1>SPACE INVADERS</h1>
    <div class="subtitle">Olavo Marchiori</div>
    <button class="btn-menu" onclick="iniciarHistoria()">JOGAR</button>
</div>

<div id="game-container">
    <div id="dialogo-box"></div>
    <div id="alerta-invasao">A INVASÃO COMEÇOU!</div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dialBox = document.getElementById('dialogo-box');
const alerta = document.getElementById('alerta-invasao');

canvas.width = 800;
canvas.height = 600;

const skinPlayer = new Image(); skinPlayer.src = 'jogadorprincipal.png';
const skinAmigo = new Image(); skinAmigo.src = 'amigo.png';

let modo='menu';
let cam={x:0,y:0,zoom:1,tZoom:1};

let player={x:450,y:450,w:65,h:65,tx:450,ty:450,rot:0};
let amigo={x:250,y:450,w:65,h:65,tx:250,ty:450,rot:0};

let tiros=[],invasores=[],keys={};
let particulas=[],subindo=false;

function lerp(a,b,n){return(1-n)*a+n*b;}

function falar(t,tempo,cb){
    dialBox.innerText=t;
    dialBox.style.display='block';
    setTimeout(()=>dialBox.style.opacity='1',10);

    setTimeout(()=>{
        dialBox.style.opacity='0';
        setTimeout(()=>{
            dialBox.style.display='none';
            if(cb)cb();
        },400);
    },tempo);
}

/* HISTORIA ORIGINAL + DECOLAGEM */
function iniciarHistoria(){
    document.getElementById('menu-principal').style.display='none';
    document.getElementById('game-container').style.display='block';

    modo='historia';

    setTimeout(()=>{
        cam.tZoom=1.6;

        falar("Hunter: Eu consigo derrotar esses alienígenas sozinho!",4000,()=>{
            amigo.tx=330;

            falar("Riven: Você enlouqueceu? São muitos!",4000,()=>{
                falar("Hunter: Eu posso sim! Olha isso!",3000,()=>{
                    demonstrarHabilidades();
                });
            });
        });

    },1000);
}

function demonstrarHabilidades(){
    player.tx=650;

    let mtr=setInterval(()=>{tiros.push({x:player.x+30,y:player.y,s:18});},150);

    setTimeout(()=>{
        clearInterval(mtr);
        player.tx=400;

        falar("Hunter: Adeus, Riven...",2000,()=>{
            iniciarDecolagem();
        });

    },2000);
}

function iniciarDecolagem(){
    modo='decolando';
    subindo=true;

    let subida=setInterval(()=>{
        player.ty-=7;

        particulas.push({
            x:player.x+30+(Math.random()*20-10),
            y:player.y+60,
            size:Math.random()*6+4,
            life:60
        });

        if(player.y<-120){
            clearInterval(subida);
            subindo=false;

            alerta.style.display='block';

            setTimeout(()=>{
                alerta.style.display='none';
                iniciarJogoReal();
            },2500);
        }

    },16);
}

function iniciarJogoReal(){
    modo='jogando';

    for(let i=0;i<30;i++){
        invasores.push({x:(i%10)*65+85,y:Math.floor(i/10)*50+60,w:45,h:35,vivo:true});
    }

    window.addEventListener('keydown',e=>keys[e.code]=true);
    window.addEventListener('keyup',e=>keys[e.code]=false);
}

function drawShip(img,obj,fallback){
    ctx.save();
    ctx.translate(obj.x+obj.w/2,obj.y+obj.h/2);

    if(subindo && obj===player){
        ctx.shadowBlur=30;
        ctx.shadowColor='#00d2ff';
    }

    if(img.complete) ctx.drawImage(img,-obj.w/2,-obj.h/2,obj.w,obj.h);
    else {ctx.fillStyle=fallback; ctx.fillRect(-obj.w/2,-obj.h/2,obj.w,obj.h);}

    ctx.restore();
}

function gameLoop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    player.x=lerp(player.x,player.tx,0.08);
    player.y=lerp(player.y,player.ty,0.08);
    amigo.x=lerp(amigo.x,amigo.tx,0.08);

    drawShip(skinPlayer,player,'#0f0');
    if(amigo.y<700) drawShip(skinAmigo,amigo,'#0ff');

    particulas.forEach((p,i)=>{
        p.y+=2;p.life--;
        ctx.fillStyle=`rgba(200,200,255,${p.life/60})`;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
        if(p.life<=0) particulas.splice(i,1);
    });

    requestAnimationFrame(gameLoop);
}
gameLoop();
</script>

</body>
</html>
