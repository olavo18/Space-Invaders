<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders - Olavo Marchiori</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --neon-blue: #00d2ff;
    --neon-pink: #ff0055;
    --space-dark: #050510;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background-color: var(--space-dark);
    background-image: radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 20px);
    background-size: 50px 50px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: white;
    height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#menu-principal {
    text-align:center;
    background: rgba(10,10,30,0.95);
    padding:50px;
    border-radius:40px;
    border:2px solid var(--neon-blue);
    backdrop-filter: blur(15px);
}

h1 {
    font-family:'Orbitron';
    color: var(--neon-blue);
    text-shadow:0 0 20px var(--neon-blue);
}

.btn-menu {
    margin-top:20px;
    padding:15px;
    cursor:pointer;
}

#game-container {
    display:none;
    position:relative;
    width:800px;
    height:600px;
    background:#000;
}

#dialogo-box {
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    color:black;
    padding:15px;
    display:none;
}

#alerta-invasao {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    color:var(--neon-pink);
    font-size:40px;
    display:none;
}
</style>
</head>

<body>

<div id="menu-principal">
    <h1>SPACE INVADERS</h1>
    <button class="btn-menu" onclick="iniciarHistoria()">JOGAR</button>
</div>

<div id="game-container">
    <div id="dialogo-box"></div>
    <div id="alerta-invasao">A INVASÃO COMEÇOU!</div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const dialBox = document.getElementById('dialogo-box');
const alerta = document.getElementById('alerta-invasao');

canvas.width = 800;
canvas.height = 600;

let modo = 'menu';

let player = { x:400, y:450, tx:400, ty:450, w:60, h:60 };
let amigo = { x:250, y:450, tx:250, ty:450 };

let tiros = [];
let invasores = [];
let keys = {};

let particulas = [];
let subindo = false;

function lerp(a,b,n){ return (1-n)*a+n*b; }

function falar(texto, tempo, callback){
    dialBox.innerText = texto;
    dialBox.style.display = 'block';
    setTimeout(()=>{
        dialBox.style.display = 'none';
        if(callback) callback();
    }, tempo);
}

function iniciarHistoria(){
    document.getElementById('menu-principal').style.display='none';
    document.getElementById('game-container').style.display='block';

    falar("Hunter: Eu consigo derrotar esses alienígenas sozinho!", 3000, ()=>{
        falar("Riven: Você enlouqueceu?", 3000, ()=>{
            falar("Hunter: Adeus, Riven...", 2000, ()=>{
                iniciarDecolagem();
            });
        });
    });
}

function iniciarDecolagem(){
    modo='decolando';
    subindo=true;

    let subida = setInterval(()=>{
        player.ty -= 6;

        particulas.push({
            x: player.x + 30 + (Math.random()*20-10),
            y: player.y + 60,
            size: Math.random()*6+4,
            life: 60
        });

        if(player.y < -100){
            clearInterval(subida);
            subindo=false;

            alerta.style.display='block';

            setTimeout(()=>{
                alerta.style.display='none';
                iniciarJogoReal();
            }, 2500);
        }

    },16);
}

function iniciarJogoReal(){
    modo='jogando';
    for(let i=0;i<20;i++){
        invasores.push({x:50+i*30,y:50,vivo:true});
    }

    window.addEventListener('keydown', e=>keys[e.code]=true);
    window.addEventListener('keyup', e=>keys[e.code]=false);
}

function drawPlayer(){
    ctx.save();

    if(subindo){
        ctx.shadowBlur=30;
        ctx.shadowColor='#00d2ff';
    }

    ctx.fillStyle='#00ffcc';
    ctx.fillRect(player.x, player.y, player.w, player.h);

    ctx.restore();
}

function gameLoop(){
    ctx.clearRect(0,0,800,600);

    player.x = lerp(player.x, player.tx, 0.1);
    player.y = lerp(player.y, player.ty, 0.1);

    drawPlayer();

    // fumaça
    particulas.forEach((p,i)=>{
        p.y+=2;
        p.life--;

        ctx.fillStyle=`rgba(200,200,255,${p.life/60})`;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();

        if(p.life<=0) particulas.splice(i,1);
    });

    if(modo==='jogando'){
        if(keys['ArrowLeft']) player.tx-=5;
        if(keys['ArrowRight']) player.tx+=5;
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
