<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders Neon - Ultra Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
:root{
--neon-blue:#00d2ff;
--neon-pink:#ff0055;
--space-dark:#050510;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:radial-gradient(circle,#1a1a3a 0%,#050510 100%);
font-family:'Plus Jakarta Sans',sans-serif;
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

#overlay-start{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
cursor:pointer;
}

#overlay-start h1{
font-size:40px;
font-family:'Orbitron';
color:#00d2ff;
text-shadow:0 0 20px #00d2ff;
animation:pulse 1s infinite;
}

#overlay-start p{
opacity:.7;
margin-top:10px;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.05)}
100%{transform:scale(1)}
}

#menu-principal{
display:none;
width:550px;
padding:50px;
background:rgba(0,0,0,.75);
border:3px solid #00d2ff;
border-radius:30px;
backdrop-filter:blur(15px);
text-align:center;
box-shadow:0 0 50px rgba(0,210,255,.3);
}

#menu-principal h1{
font-size:55px;
font-family:'Orbitron';
color:#00d2ff;
margin-bottom:20px;
text-shadow:0 0 30px #00d2ff;
}

#menu-principal p{
opacity:.8;
line-height:1.8;
margin-bottom:30px;
}

.btn-play{
padding:18px 35px;
border:none;
background:linear-gradient(135deg,#ff0055,#ff0080);
border-radius:18px;
color:white;
font-size:20px;
font-family:'Orbitron';
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.btn-play:hover{
transform:scale(1.05);
box-shadow:0 0 30px rgba(255,0,85,.7);
}

#game-container{
display:none;
position:relative;
width:800px;
height:600px;
border:3px solid #00d2ff;
overflow:hidden;
border-radius:15px;
background:black;
box-shadow:0 0 80px rgba(0,210,255,.4);
}

#gameCanvas{
background:transparent;
}

#dialogo-box{
position:absolute;
left:50%;
bottom:40px;
transform:translateX(-50%);
width:700px;
padding:18px 30px;
background:rgba(0,0,0,.8);
border:2px solid #00d2ff;
border-radius:20px;
font-size:20px;
font-weight:bold;
display:none;
z-index:200;
backdrop-filter:blur(10px);
}

#dialogo-box.show{
display:block;
animation:fade .4s;
}

@keyframes fade{
from{opacity:0;transform:translateX(-50%) translateY(20px)}
to{opacity:1;transform:translateX(-50%) translateY(0)}
}

#efeito-tempo{
position:absolute;
inset:0;
background:rgba(0,180,255,.15);
display:none;
pointer-events:none;
z-index:50;
backdrop-filter:blur(3px);
}

#ui-camada{
position:absolute;
top:15px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
font-family:'Orbitron';
font-size:14px;
z-index:100;
}

#boss-hp-bar{
position:absolute;
top:45px;
left:50%;
transform:translateX(-50%);
width:450px;
height:18px;
background:#111;
border:2px solid white;
display:none;
border-radius:10px;
overflow:hidden;
z-index:100;
}

#boss-hp-fill{
height:100%;
width:100%;
background:linear-gradient(90deg,#ff0055,#ffae3b);
}

#boss-hp-label{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
font-family:'Orbitron';
display:none;
z-index:100;
}

#game-over{
position:absolute;
inset:0;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:500;
}

#game-over h1{
font-size:60px;
font-family:'Orbitron';
color:#ff0055;
margin-bottom:20px;
}

.shake{
animation:shake .1s infinite;
}

@keyframes shake{
0%{transform:translate(3px,3px)}
50%{transform:translate(-3px,-3px)}
100%{transform:translate(2px,-2px)}
}
</style>
</head>

<body>

<div id="overlay-start" onclick="permitirAudio()">
<h1>CLIQUE PARA COMEÇAR</h1>
<p>ativar áudio neon</p>
</div>

<div id="menu-principal">
<h1>SPACE INVADERS</h1>

<p>
A/D ou SETAS para mover<br>
ESPAÇO para atirar<br>
E = Bola de fogo<br>
R = Escudo
</p>

<button class="btn-play" onclick="iniciarHistoria()">INICIAR</button>
</div>

<div id="game-container">

<div id="ui-camada">
<div>FASE: <span id="fase-txt">1</span></div>
<div>KILLS: <span id="hab-txt">0</span></div>
<div>VIDAS: <span id="vidas-txt">3</span></div>
</div>

<div id="boss-hp-label">CHEFE</div>
<div id="boss-hp-bar">
<div id="boss-hp-fill"></div>
</div>

<div id="efeito-tempo"></div>

<div id="dialogo-box"></div>

<div id="game-over">
<h1>GAME OVER</h1>
<button class="btn-play" onclick="location.reload()">REINICIAR</button>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);

const skins = {
player:new Image(),
amigo:new Image(),
alien:new Image(),
chefe:new Image(),
chefe2:new Image(),
fireball:new Image()
};

skins.player.src="jogadorprincipal.png";
skins.amigo.src="amigo.png";
skins.alien.src="alien.png";
skins.chefe.src="chefe1.png";
skins.chefe2.src="chefe2.png";
skins.fireball.src="bola-defogo.png";

const somMenu = new Audio('menu.mp3');
const somTempo = new Audio('tempo.mp3');
const somZaWarudo = new Audio('zawarudo.mp3');
const somTiroPlayer = new Audio('nave1.mp3');
const somTiroInimigo = new Audio('nave2.mp3');

somMenu.loop = true;

function permitirAudio(){

$('overlay-start').style.display='none';
$('menu-principal').style.display='block';

somMenu.play();

}

let modo='menu';
let faseAtual=1;
let tempoParado=false;
let bossMorrendo=false;
let frameAnim=0;
let lastTime=performance.now();
let tempoCooldown=0;

const player={
x:370,
y:500,
w:60,
h:60,
vidas:3,
tx:370,
cooldown:0,
kills:0
};

const amigo={
x:-150,
y:450,
w:60,
h:60,
tx:-150
};

let invasores=[];
let tiros=[];
let tirosE=[];
let particulas=[];
const keys={};

const falasChefe=[
"ZA WARUDO!",
"O TEMPO É MEU!",
"VOCÊ NÃO PODE SE MEXER!",
"INÚTIL!"
];

function falar(texto,tempo,cb){

const box=$('dialogo-box');

box.innerText=texto;

box.classList.add('show');

setTimeout(()=>{

box.classList.remove('show');

if(cb) cb();

},tempo);

}

function iniciarHistoria(){

somMenu.pause();

$('menu-principal').style.display='none';
$('game-container').style.display='block';

modo='historia';

amigo.tx=220;
player.tx=520;

falar("Hunter: Vou destruir todos eles!",2200,()=>{

falar("Amigo: Você vai morrer Hunter!",2200,()=>{

falar("Hunter: Não hoje...",1800,()=>{

falar("Hunter: ADEUS MEU AMIGO!",2200,()=>{

animacaoSubida();

});

});

});

});

}

function animacaoSubida(){

let fumaça=[];

let interval=setInterval(()=>{

fumaça.push({
x:player.x+30+(Math.random()*20-10),
y:player.y+55,
r:Math.random()*10+5,
a:1
});

},30);

let subir=setInterval(()=>{

player.y-=4;

if(player.y<-150){

clearInterval(subir);
clearInterval(interval);

falar("A INVASÃO COMEÇOU",2500,()=>{

modo='jogando';

player.y=500;
player.tx=370;

criarFase();

});

}

},16);

function desenharFumaca(){

for(let i=fumaça.length-1;i>=0;i--){

let p=fumaça[i];

ctx.beginPath();
ctx.fillStyle=`rgba(180,180,180,${p.a})`;
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();

p.y+=1;
p.a-=0.02;

if(p.a<=0){
fumaça.splice(i,1);
}

}

requestAnimationFrame(desenharFumaca);

}

desenharFumaca();

}

function criarFase(){

invasores=[];
tiros=[];
tirosE=[];

if(faseAtual%10===0){

$('boss-hp-bar').style.display='block';
$('boss-hp-label').style.display='block';

invasores.push({
x:300,
y:80,
w:180,
h:150,
hp:5000,
maxHp:5000,
isBoss:true,
tipo:2,
dir:1,
vel:3
});

}else{

$('boss-hp-bar').style.display='none';
$('boss-hp-label').style.display='none';

for(let r=0;r<3;r++){

for(let c=0;c<5;c++){

invasores.push({
x:c*110+130,
y:r*70+70,
w:55,
h:55,
vivo:true,
dir:1,
vel:1+faseAtual*.2
});

}

}

}

}

window.addEventListener('keydown',e=>{

keys[e.code]=true;

});

window.addEventListener('keyup',e=>{

keys[e.code]=false;

});

function ativarZaWarudo(boss){

if(tempoParado) return;

tempoParado=true;

somZaWarudo.currentTime=0;
somZaWarudo.play();

somTempo.currentTime=0;
somTempo.play();

$('efeito-tempo').style.display='block';

$('game-container').classList.add('shake');

const frase=falasChefe[Math.floor(Math.random()*falasChefe.length)];

falar(frase,2500);

setTimeout(()=>{

tempoParado=false;

$('efeito-tempo').style.display='none';

$('game-container').classList.remove('shake');

somTempo.pause();

},5000);

}

function desenharNave(obj,img){

ctx.drawImage(img,obj.x,obj.y,obj.w,obj.h);

}

function colide(a,b){

return a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y;

}

function gameLoop(now){

const dt=Math.min(32,now-lastTime);

lastTime=now;

frameAnim+=dt*.06;

ctx.clearRect(0,0,800,600);

if(modo==='menu'){

requestAnimationFrame(gameLoop);
return;

}

player.x += (player.tx-player.x)*0.08;
amigo.x += (amigo.tx-amigo.x)*0.08;

if(amigo.x>-100){

desenharNave(amigo,skins.amigo);

}

desenharNave(player,skins.player);

if(modo!=='jogando'){

requestAnimationFrame(gameLoop);
return;

}

$('fase-txt').innerText=faseAtual;
$('vidas-txt').innerText=player.vidas;
$('hab-txt').innerText=player.kills;

const boss=invasores.find(i=>i.isBoss && i.hp>0);

if(boss){

$('boss-hp-fill').style.width=(boss.hp/boss.maxHp*100)+'%';

tempoCooldown+=dt;

if(tempoCooldown>=10000){

tempoCooldown=0;

ativarZaWarudo(boss);

}

}

if(!tempoParado){

if((keys['ArrowLeft']||keys['KeyA']) && player.tx>0){

player.tx-=6;

}

if((keys['ArrowRight']||keys['KeyD']) && player.tx<740){

player.tx+=6;

}

if(keys['Space'] && player.cooldown<=0){

tiros.push({
x:player.x+28,
y:player.y,
w:6,
h:20,
s:10
});

player.cooldown=250;

somTiroPlayer.currentTime=0;
somTiroPlayer.play();

}

}

if(player.cooldown>0){

player.cooldown-=dt;

}

for(let i=tiros.length-1;i>=0;i--){

const t=tiros[i];

if(!tempoParado){

t.y-=t.s;

}

ctx.fillStyle='white';
ctx.fillRect(t.x,t.y,t.w,t.h);

if(t.y<-50){

tiros.splice(i,1);

}

}

let vivos=0;

invasores.forEach(inv=>{

if(inv.isBoss){

ctx.drawImage(skins.chefe2,inv.x,inv.y,inv.w,inv.h);

if(!tempoParado){

inv.x+=inv.vel*inv.dir;

if(inv.x<0 || inv.x>620){

inv.dir*=-1;

}

}

}else{

if(inv.vivo){

vivos++;

ctx.drawImage(skins.alien,inv.x,inv.y,inv.w,inv.h);

if(!tempoParado){

inv.x+=inv.vel*inv.dir;

}

}

}

});

for(let ti=tiros.length-1;ti>=0;ti--){

for(let inv of invasores){

if(inv.isBoss){

if(colide(tiros[ti],inv)){

inv.hp-=50;

tiros.splice(ti,1);

if(inv.hp<=0){

bossMorrendo=true;

$('game-container').classList.add('shake');

falar("MK-II: Nos veremos novamente...",3500,()=>{

$('game-container').classList.remove('shake');

faseAtual++;

criarFase();

});

}

break;

}

}else{

if(inv.vivo && colide(tiros[ti],inv)){

inv.vivo=false;

player.kills++;

tiros.splice(ti,1);

break;

}

}

}

}

if(vivos===0 && !boss){

faseAtual++;

criarFase();

}

requestAnimationFrame(gameLoop);

}

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
