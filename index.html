<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders Neon - Ultra Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <!-- LINK PARA O CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="overlay-start" onclick="permitirAudio()">
    <h2>CLIQUE PARA ATIVAR O NEON</h2>
    <p>(Habilita trilha sonora e efeitos)</p>
</div>

<div id="menu-principal">
    <h1>SPACE INVADERS</h1>
    <p>Mova com <b>A D</b> ou <b>SETAS</b><br>Atire com <b>ESPAÇO</b><br>Especial <b>(E)</b> | Escudo 2s <b>(R)</b><br>Chefes a cada 5 níveis.</p>
    <button class="btn-play" onclick="iniciarHistoria()">INICIAR JOGO</button>
</div>

<div id="game-container">
    <div id="ui-camada">
        <div>FASE: <span id="fase-txt">1</span></div>
        <div>BOLA FOGO (E): <span id="hab-txt">0</span>/3</div>
        <div>ESCUDO (R): <span id="escudo-txt">0</span>/2</div>
        <div>VIDAS: <span id="vidas-txt">3</span></div>
    </div>
    
    <div id="boss-hp-label">CHEFE SUPREMO</div>
    <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
    
    <!-- Imagem do Boss 3 (Só aparece na fase 15) -->
    <img id="boss3-gif" src="chefe3.gif" style="position: absolute; display: none; z-index: 45;">

    <div id="efeito-tempo"></div>
    <div id="dialogo-box"></div>
    
    <div id="game-over">
        <h2>FALHA NA MISSÃO</h2>
        <button class="btn-play" style="width:auto;padding:14px 30px" onclick="location.reload()">REINICIAR</button>
    </div>
    
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<!-- LINK PARA O JAVASCRIPT -->
<script src="script.js"></script>
</body>
</html>
