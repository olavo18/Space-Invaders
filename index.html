<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders Neon - Ultra Edition</title>

<link rel="icon" href="data:,">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>

:root{
 --neon-blue:#00d2ff;
 --neon-pink:#ff0055;
 --neon-orange:#ffae3b;
 --space-dark:#050510;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
}

body{
 background:radial-gradient(circle at center,#1a1a3a 0%,#050510 100%);
 font-family:'Plus Jakarta Sans',sans-serif;
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;
 overflow:hidden;
}

body::before{
 content:'';
 position:fixed;
 inset:0;
 pointer-events:none;
 background-image:
 radial-gradient(1px 1px at 20% 30%,#fff,transparent),
 radial-gradient(1px 1px at 70% 80%,#fff,transparent),
 radial-gradient(2px 2px at 40% 60%,#00d2ff,transparent);
 background-size:600px 600px;
 opacity:.4;
 animation:drift 100s linear infinite;
}

@keyframes drift{
 from{background-position:0 0;}
 to{background-position:600px 600px;}
}

#overlay-start{
 position:fixed;
 inset:0;
 background:black;
 z-index:9999;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 cursor:pointer;
}

#overlay-start h2{
 font-size:38px;
 color:#00d2ff;
 font-family:'Orbitron';
 text-shadow:0 0 20px #00d2ff;
 animation:pulse 1.5s infinite;
}

#overlay-start p{
 margin-top:15px;
 opacity:.7;
}

@keyframes pulse{
 0%{transform:scale(1);}
 50%{transform:scale(1.05);}
 100%{transform:scale(1);}
}

#menu-principal{
 display:none;
 width:95%;
 max-width:650px;
 background:rgba(5,5,20,.88);
 border:3px solid #00d2ff;
 border-radius:35px;
 padding:50px;
 text-align:center;
 backdrop-filter:blur(15px);
 box-shadow:0 0 50px rgba(0,210,255,.3);
 position:relative;
 overflow:hidden;
}

#menu-principal::after{
 content:'';
 position:absolute;
 top:-100%;
 left:0;
 width:100%;
 height:50%;
 background:linear-gradient(to bottom,
 transparent,
 rgba(0,210,255,.08),
 transparent);
 animation:scan 4s linear infinite;
}

@keyframes scan{
 0%{top:-100%;}
 100%{top:200%;}
}

h1{
 font-size:54px;
 font-family:'Orbitron';
 letter-spacing:8px;
 color:#00d2ff;
 text-shadow:
 0 0 20px #00d2ff,
 0 0 40px #00d2ff;
 margin-bottom:25px;
}

.btn-play{
 width:100%;
 padding:20px;
 border:none;
 border-radius:18px;
 font-size:22px;
 font-family:'Orbitron';
 font-weight:900;
 cursor:pointer;
 color:white;
 background:linear-gradient(135deg,#ff0055,#ff3c8d);
 box-shadow:0 10px 40px rgba(255,0,85,.5);
 transition:.3s;
}

.btn-play:hover{
 transform:scale(1.04);
}

#game-container{
 display:none;
 position:relative;
 width:800px;
 height:600px;
 background:black;
 border:3px solid #00d2ff;
 border-radius:15px;
 overflow:hidden;
 box-shadow:0 0 100px rgba(0,210,255,.3);
}

#dialogo-box{
 position:absolute;
 bottom:25px;
 left:50%;
 transform:translateX(-50%);
 width:700px;
 max-width:92%;
 background:rgba(0,0,0,.82);
 border:2px solid #00d2ff;
 border-radius:20px;
 padding:18px 25px;
 text-align:center;
 font-size:20px;
 font-family:'Orbitron';
 z-index:500;
 display:none;
}

#dialogo-box.show{
 display:block;
 animation:fadeDialog .25s ease;
}

@keyframes fadeDialog{
 from{
   opacity:0;
   transform:translateX(-50%) translateY(15px);
 }
 to{
   opacity:1;
   transform:translateX(-50%) translateY(0);
 }
}

#efeito-tempo{
 position:absolute;
 inset:0;
 background:rgba(100,200,255,.25);
 display:none;
 z-index:50;
 pointer-events:none;
 backdrop-filter:blur(2px);
}

canvas{
 display:block;
}

</style>
</head>
<body>
