<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders - Hunter Protocol</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --neon-blue: #00d2ff;
    --neon-pink: #ff0055;
    --space-dark: #050510;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background: var(--space-dark);
    background-image: radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 20px);
    background-size: 50px 50px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color:white;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

/* MENU NOVO */
#menu-principal {
    position: absolute;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.menu-card {
    background: rgba(10,10,30,0.85);
    padding:60px;
    border-radius:30px;
    backdrop-filter:blur(20px);
    border:1px solid rgba(0,210,255,0.3);
    box-shadow:0 0 60px rgba(0,210,255,0.15);
    text-align:center;
    animation:floatMenu 5s infinite ease-in-out;
}

@keyframes floatMenu {
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1 {
    font-family:'Orbitron';
    font-size:38px;
    color:var(--neon-blue);
    text-shadow:0 0 25px var(--neon-blue);
}

.subtitle {
    margin:20px 0 40px;
    opacity:0.7;
}

.btn-menu {
    display:block;
    margin:10px 0;
    padding:15px;
    width:220px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.2);
    background:transparent;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.btn-menu:hover {
    transform:scale(1.05);
    background:rgba(255,255,255,0.08);
}

.btn-play {
    background:var(--neon-pink);
    border:none;
    box-shadow:0 0 25px rgba(255,0,85,0.4);
}

/* GAME */
#game-container {
    display:none;
    position:relative;
    width:800px;
    height:600px;
    background:black;
    border:2px solid var(--neon-blue);
}

/* LEGENDA */
#dialogo-box {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.7);
    padding:15px;
    border-radius:10px;
    opacity:0;
    display:none;
    transition:0.4s;
}

/* ALERTA */
#alerta-invasao {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:40px;
    color:var(--neon-pink);
    display:none;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu-principal">
    <div class="menu-card">
        <h1>SPACE INVADERS</h1>
        <div class="subtitle">Missão Hunter</div>

        <button class="btn-menu btn-play" onclick="iniciarHistoria()">JOGAR</button>
    </div>
</div>

<!-- GAME -->
<div id="game-container">
    <div id="dialogo-box"></div>
    <div id="alerta-invasao">A INVASÃO COMEÇOU!</div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const dialBox=document.getElementById('dialogo-box');
const alerta=document.getElementById('alerta-invasao');

canvas.width=800;
canvas.height=600;

const skinPlayer=new Image(); skinPlayer.src='jogadorprincipal.png';
const skinAmigo=new Image(); skinAmigo.src='amigo.png';

let player={x:400,y:450,tx:400,ty:450,w:60,h:60};
let amigo={x:250,y:450,tx:250,ty:450,w:60,h:60};

let tiros=[],invasores=[],keys={};
let particulas=[],subindo=false;
let modo='menu';

function lerp(a,b,n){return(1-n)*a+n*b;}

/* LEGENDA */
function falar(t,tempo,cb){
    dialBox.innerText=t;
    dialBox.style.display='block';
    setTimeout(()=>dialBox.style.opacity=1,10);

    setTimeout(()=>{
        dialBox.style.opacity=0;
        setTimeout(()=>{
            dialBox.style.display='none';
            if(cb)cb();
        },400);
    },tempo);
}

/* HISTORIA */
function iniciarHistoria(){
    document.getElementById('menu-principal').style.display='none';
    document.getElementById('game-container').style.display='block';

    falar("Hunter: Eu consigo derrotar eles!",3000,()=>{
        falar("Riven: Você não vai sobreviver!",3000,()=>{
            falar("Hunter: Adeus...",2000,()=>{
                decolar();
            });
        });
    });
}

/* DECOLAGEM */
function decolar(){
    subindo=true;

    let subida=setInterval(()=>{
        player.ty-=6;

        particulas.push({
            x:player.x+30,
            y:player.y+60,
            size:5,
            life:50
        });

        if(player.y<-100){
            clearInterval(subida);
            alerta.style.display='block';

            setTimeout(()=>{
                alerta.style.display='none';
                iniciarJogo();
            },2000);
        }

    },16);
}

/* JOGO */
function iniciarJogo(){
    modo='jogo';

    for(let i=0;i<20;i++){
        invasores.push({x:50+i*30,y:50});
    }

    window.addEventListener('keydown',e=>keys[e.code]=true);
    window.addEventListener('keyup',e=>keys[e.code]=false);
}

/* LOOP */
function loop(){
    ctx.clearRect(0,0,800,600);

    player.x=lerp(player.x,player.tx,0.1);
    player.y=lerp(player.y,player.ty,0.1);

    ctx.fillStyle='#0f0';
    ctx.fillRect(player.x,player.y,60,60);

    particulas.forEach((p,i)=>{
        p.y+=2;
        p.life--;
        ctx.fillStyle=`rgba(200,200,255,${p.life/50})`;
        ctx.fillRect(p.x,p.y,p.size,p.size);
        if(p.life<=0) particulas.splice(i,1);
    });

    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
